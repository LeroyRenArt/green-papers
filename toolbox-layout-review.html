<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbox layout review — isolated test fixture</title><style>body{font:16px/1.5 system-ui;margin:20px;background:#fff;color:#222}button{margin:8px;padding:10px}iframe{display:block;border:1px solid #aaa;height:850px;margin-top:20px}pre{white-space:pre-wrap}table{border-collapse:collapse}td,th{padding:6px;border:1px solid #aaa}</style><h1>Toolbox layout review</h1><p>Isolated preview fixture. Fixed CSS viewport widths; text doubled through computed font sizes and line heights. This is a simulation, not physical iPhone, Safari, browser zoom or VoiceOver verification.</p><p id="status" role="status">Running 16 cases…</p><button id="mobile">Show collection at 320px</button><button id="double">Show collection at 320px with doubled text</button><button id="desktop">Show collection at 980px</button><table><thead><tr><th>Page</th><th>Width</th><th>Text factor</th><th>Document width</th><th>Result</th></tr></thead><tbody id="results"></tbody></table><pre id="json"></pre><iframe id="test" title="Toolbox layout review frame"></iframe><script>
const frame=document.getElementById('test');const results=[];
function load(path,width,factor){return new Promise((resolve,reject)=>{frame.style.width=width+'px';frame.onload=()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(factor===2){const sizes=[...d.querySelectorAll('body, body *')].filter(e=>!['SCRIPT','STYLE'].includes(e.tagName)).map(e=>{const s=w.getComputedStyle(e);return[e,parseFloat(s.fontSize),s.lineHeight]});for(const [e,size,line]of sizes){e.style.fontSize=size*2+'px';if(line.endsWith('px'))e.style.lineHeight=parseFloat(line)*2+'px';}}requestAnimationFrame(()=>requestAnimationFrame(()=>{const docWidth=d.documentElement.scrollWidth;const item={page:path,width,textFactor:factor,documentWidth:docWidth,viewportWidth:d.documentElement.clientWidth,h1:d.querySelectorAll('h1').length,main:d.querySelectorAll('main').length,result:docWidth<=width&&d.querySelectorAll('h1').length===1&&d.querySelectorAll('main').length===1?'PASS':'FAIL'};resolve(item);}));}catch(e){reject(e)}};frame.src=path+'?layout-review='+width+'-'+factor;});}
(async()=>{try{for(const path of ['/toolbox/','/toolbox/ai-in-right-relationship/'])for(const width of [320,390,980,1280])for(const factor of [1,2]){const item=await load(path,width,factor);results.push(item);const row=document.createElement('tr');for(const v of [path,width,factor,item.documentWidth,item.result]){const td=document.createElement('td');td.textContent=v;row.append(td)}document.getElementById('results').append(row);}document.getElementById('json').textContent=JSON.stringify(results,null,2);document.getElementById('status').textContent=results.every(r=>r.result==='PASS')?'PASS: all 16 layout cases.':'FAIL: see cases below.';await load('/toolbox/ai-in-right-relationship/',320,1);}catch(e){document.getElementById('status').textContent='ERROR: '+e.message}})();
document.getElementById('mobile').onclick=()=>load('/toolbox/ai-in-right-relationship/',320,1);
document.getElementById('double').onclick=()=>load('/toolbox/ai-in-right-relationship/',320,2);
document.getElementById('desktop').onclick=()=>load('/toolbox/ai-in-right-relationship/',980,1);
</script></html>
