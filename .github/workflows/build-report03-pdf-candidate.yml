name: Build Report 03 PDF candidate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-report03-pdf:
    if: github.event.pull_request.head.ref == 'editorial/report03-realign-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Report 03 PDF
        run: node scripts/print_one_pdf.mjs papers/water-into-dry-riverbeds.html papers/water-into-dry-riverbeds.pdf
      - name: Verify PDF signature
        run: |
          test -s papers/water-into-dry-riverbeds.pdf
          head -c 5 papers/water-into-dry-riverbeds.pdf | grep -q '%PDF-'
      - uses: actions/upload-artifact@v4
        with:
          name: report03-pdf-candidate
          path: papers/water-into-dry-riverbeds.pdf
          retention-days: 1
          if-no-files-found: error
