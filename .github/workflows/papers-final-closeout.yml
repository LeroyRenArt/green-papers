name: Papers production Class 6 closeout
on:
  push:
    branches:
    - pdf-production-proof-20261011
    paths:
    - .github/workflows/papers-final-closeout.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 23d1e46e619f843e0f74dd318ef50e4e96ad7f79
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.12
    - name: Install recorded browser control
      run: 'python -m pip install playwright==1.55.0

        python -m playwright install --with-deps chromium

        '
    - name: 'Class 6: exact production bytes, protected regressions and 24 browser cases'
      run: "python - <<'PYCODE'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport os,json,hashlib,subprocess,traceback,re\nfrom urllib.parse import urlsplit\nfrom playwright.sync_api import sync_playwright\nROOT=Path.cwd();OUT=Path(os.environ['RUNNER_TEMP'])/'papers-final-closeout';OUT.mkdir()\nBASE='235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2';HEAD='23d1e46e619f843e0f74dd318ef50e4e96ad7f79';PREVIEW='https://papers.spiralweb.earth'\nSPEC=[{'path': 'da/laeseorientering.html', 'sha256': '9845d221e4b38b825608959130875c21eca2d89994d2e860a9d4f8260c7d2937', 'git_blob': '9d8d5033ca5034e6ba03ca93d2f45fbe3c77d8d9', 'bytes': 10750}, {'path': 'papers/kommunalt-arbejde-som-natur.html', 'sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'git_blob': '52ebde2cc2b9d6358d65656efb3356a73804de20', 'bytes': 237386}, {'path': 'papers/municipal-work-as-nature.html', 'sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'git_blob': '0337589b5f46dde8ea2d60c82ee68c1bbfdaaa61', 'bytes': 241578}, {'path': 'papers/atlas-of-a-living-architecture.html', 'sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'git_blob': 'b40c7d19161b46fbf960ae13be4fe219c30b560a', 'bytes': 106402}, {'path': 'papers/atlas-over-en-levende-arkitektur.html', 'sha256': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c', 'git_blob': '0afe15215947965b2225e894960e9907dbde6715', 'bytes': 115549}, {'path': 'papers/the-spiral-of-hypotheses-full-register.html', 'sha256': '709088b7bfa416b9f92e8b1e1bfb7bc59aad574159c97bcb0332743725bcf6d3', 'git_blob': 'f3112d4e2984c5f99eebc0db973232a1d1de9c80', 'bytes': 97831}, {'path': 'papers/the-spiral-of-hypotheses.html', 'sha256': '24d1fd828f6b66de46ce6e2d466ccad730c4c79373530a1b1be4987090b402b0', 'git_blob': '382c1ad95022dbf1c7f4f0a4c8d01b1e97ec4d45', 'bytes': 45243}, {'path': 'papers/atlas-over-en-levende-arkitektur.pdf', 'sha256': 'c9e7d6a00635a7e4fc67ee827ee9d67ed6a416991753d8