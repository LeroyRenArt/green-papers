rth/papers/municipal-work-as-nature', 'source_sha256': 'cf708183276aa0279f07027b4eb7595f9034ffa9e49835e18e29dfa2e5e84ffb'}, {'path': 'papers/atlas-of-a-living-architecture.html', 'url': 'https://papers.spiralweb.earth/papers/atlas-of-a-living-architecture', 'source_sha256': '44cef357909866a784f16252b3662f08e84058c971661ee6531dedf48ceda138'}, {'path': 'papers/atlas-over-en-levende-arkitektur.html', 'url': 'https://papers.spiralweb.earth/papers/atlas-over-en-levende-arkitektur', 'source_sha256': '91df1ce51046afc45c19a18410923a7a77ac9020566e2925491165025b96dd0c'}, {'path': 'papers/the-spiral-of-hypotheses-full-register.html', 'url': 'https://papers.spiralweb.earth/papers/the-spiral-of-hypotheses-full-register', 'source_sha256': '3ef15b8d232f4477319f4a24eb3f6d3edb6694ac0dbae3885ae14613770f3ef4'}, {'path': 'papers/the-spiral-of-hypotheses.html', 'url': 'https://papers.spiralweb.earth/papers/the-spiral-of-hypotheses', 'source_sha256': '6e9d38d521b590a7de7c813491ea571a16f90c0f7ac6b69928d216d69f970356'}, {'path': 'library.html', 'url': 'https://papers.spiralweb.earth/library', 'source_sha256': '4dff5a5674e911ccd722b6d2e8b50b635dca7d6ca1651b48d2af1393acfe3856'}]\nsha=lambda b:hashlib.sha256(b).hexdigest()\nresult={'status':'RUNNING','base':BASE,'candidate':HEAD,'preview':PREVIEW,'timestamp_utc':datetime.now(timezone.utc).isoformat(),'checks':{},'preview_files':[],'production_html':[],'browser':[],'merge_attempts':0,'production_publication_attempts':0}\ndef command(args,label):\n r=subprocess.run(args,capture_output=True,text=True,timeout=60);(OUT/(label+'.stdout')).write_text(r.stdout);(OUT/(label+'.stderr')).write_text(r.stderr);(OUT/(label+'.command.json')).write_text(json.dumps({'args':args,'exit_code':r.returncode}));assert r.returncode==0,label;return r.stdout.strip()\ndef http(url,label):\n hp=OUT/(label+'.headers');bp=OUT/(label+'.body')\n status=command(['curl','--silent','--show-error','--compressed','--max-time','30','--dump-header',str(hp),'--output',str(bp),'--write-out','%{http_code}',url],label)\n assert status=='200',(label,status)\n return bp.read_bytes()\ndef normalize_contact_email(body):\n    # Reuse the exact contact-email decoding proven in the preceding Class 6.\n    # The current Library delta additionally removes only its observed\n    # email_off wrapper around this same literal contact link.\n    text=body.decode('utf-8')\n    contact='<a href=\"mailto:contact@spiralweb.earth\">contact@spiralweb.earth</a>'\n    wrapped='<!--email_off-->'+contact+'<!--/email_off-->'\n    if text.count(wrapped)>1:raise RuntimeError('Uventet antal kontakt-email-kommentarer.')\n    text=text.replace(wrapped,contact)\n    pattern=r'<a href=\"/cdn-cgi/l/email-protection#([0-9a-f]+)\"><span class=\"__cf_email__\" data-cfemail=\"([0-9a-f]+)\">\\[email&#160;protected\\]</span></a>'\n    matches=list(re.finditer(pattern,text))\n    decoder='<script data-cfasync=\"false\" src=\"/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js\"></script>'\n    if matches:\n        if len(matches)!=1 or text.count(decoder)!=1:raise RuntimeError('Uventet emailbeskyttelse.')\n        match=matches[0]\n        for value in match.groups():\n            data=bytes.fromhex(value)\n            if not data or bytes(x^data[0] for x in data[1:]).decode('utf-8')!='contact@spiralweb.earth':\n                raise RuntimeError('Kontakt-email afviger.')\n        text=text[:match.start()]+contact+text[match.end():]\n        text=text.replace(decoder,'',1)\n    elif decoder in text:\n        # The unchanged homepage uses the literal label Corrections.\n        # Accept only its observed provider form and the same decoded address.\n        corrections=r'<a href=\"/cdn-cgi/l/email-protection#([0-9a-f]+)\">Corrections</a>'\n        labelled=list(re.finditer(corrections,text))\n        if len(labelled)!=1 or text.count(decoder)!=1:\n            raise RuntimeError('Uventet email-decoder uden den dokumenterede kontakt-email.')\n        match=labelled[0];data=bytes.fromhex(match.group(1))\n        if not data or bytes(x^data[0] for x in data[1:]).decode('utf-8')!='contact@spiralweb.earth':\n            raise RuntimeError('Corrections-email afviger.')\n        literal='<a href=\"mailto:contact@spiralweb.earth\">Corrections</a>'\n        text=text[:match.start()]+literal+text[match.end():]\n        text=text.replace(decoder,'',1)\n    return text.encode('utf-8')\n\ndef command_source(path):return subprocess.check_output(['git','show',BASE+':'+path])\ntry:\n assert command(['git','rev-parse','HEAD'],'head')==HEAD\n paths=command(['git','diff','--name-only',BASE,HEAD],'exact-diff').splitlines();assert sorted(paths)==sorted(x['path'] for x in SPEC)\n result['checks']['exact_15_file_diff']=True\n for s in SPEC:\n  b=(ROOT/s['path']).read_bytes();assert sha(b)==s['sha256'];assert command(['git','rev-parse',HEAD+':'+s['path']],s['path'].replace('/','_')+'-gitblob')==s['git_blob']\n result['checks']['reviewed_hashes_match_repository']=True\n public=json.loads((ROOT/'public-files.json').read_text());assert all(s['path'] in public for s in SPEC)\n command(['node','scripts/build_public.mjs'],'public-build')\n built=sorted(str(p.relative_to(ROOT/'dist')) for p in (ROOT/'dist').rglob('*') if p.is_file());assert built==sorted(public)\n for name in public:assert (ROOT/name).read_bytes()==(ROOT/'dist'/name).read_bytes()\n result['checks']['all_public_build_bytes_exact']=True;result['checks']['public_files']=len(public)\n assert command(['git','status','--porcelain','--untracked-files=no'],'source-status')==''\n for i,s in enumerate(SPEC):\n  route='/'+s['path'];route=route[:-5] if route.endswith('.html') else route\n  b=http(PREVIEW+route,'preview-'+str(i));assert (normalize_contact_email(b)==normalize_contact_email((ROOT/s['path']).read_bytes()) if s['path'].endswith('.html') else sha(b)==s['sha256']),('production mismatch',s['path'])\n  result['preview_files'].append({'path':s['path'],'route':route,'status':200,'sha256':sha(b),'match':True})\n result['checks']['all_15_production_routes_match_reviewed']=True\n for i,(path,route) in enumerate([('index.html','/'),('reading-orientation.html','/reading-orientation'),('toolbox/index.html','/toolbox/'),('papers/rule-of-life.html','/papers/rule-of-life'),('papers/rule-of-life-da.html','/papers/rule-of-life-da'),('privacy.html','/privacy')]):\n  expected=subprocess.check_output(['git','show',BASE+':'+path]);assert (ROOT/path).read_bytes()==expected,('protected source changed',path)\n  b=http(PREVIEW+route,'protected-'+str(i));assert normalize_contact_email(b)==normalize_contact_email(expected),('protected HTTP changed',path)\n  result['production_html'].append({'path':path,'sha256':sha(b),'baseline_match':True})\n result['checks']['six_protected_regressions_match']=True\n with sync_playwright() as pw:\n  browser=pw.chromium.launch();result['browser_version']=browser.version\n  for t in TARGETS:\n   for width,height in [(1280,900),(390,844),(320,800)]:\n    context=browser.new_context(viewport={'width':width,'height':height});page=context.new_page();errors=[];bad=[]\n    page.on('pageerror',lambda e:errors.append(str(e)))\n    page.on('response',lambda r:bad.append({'url':r.url,'status':r.status}) if r.status>=400 else None)\n    route='/'+t['path'][:-5];response=page.goto(PREVIEW+route,wait_until='networkidle',timeout=30000);assert response.status==200\n    page.evaluate('()=>document.fonts.ready')\n    measure=page.evaluate('()=>({overflow:document.documentElement.scrollWidth-innerWidth,font_status:document.fonts.status,broken_fragments:[...document.querySelectorAll(\"a[href^=\\\\\"#\\\\\"]\")].map(a=>a.getAttribute(\"href\").slice(1)).filter(x=>x&&!document.getElementById(decodeURIComponent(x)))})')\n    assert measure['overflow']==0 and measure['font_status']=='loaded' and not measure['broken_fragments'] and not errors and not bad,(t['path'],width,measure,errors,bad)\n    result['browser'].append({'path':t['path'],'width':width,**measure,'errors':errors,'bad_responses':bad})\n    context.close()\n  browser.close()\n result['checks']['all_24_hosted_browser_cases_pass']=True\n result['status']='PASS_CLASS6';result['production_ready']=True\nexcept Exception as e:\n result['status']='STOP';result['production_ready']=False;result['error']=str(e);(OUT/'traceback.txt').write_text(traceback.format_exc());raise\nfinally:\n (OUT/'RESULT.json').write_text(json.dumps(result,indent=2));(OUT/'MANIFEST.json').write_text(json.dumps({str(p.relative_to(OUT)):sha(p.read_bytes()) for p in OUT.rglob('*') if p.is_file()},indent=2))\nPYCODE\n"
    - name: Preserve PASS or STOP evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: papers-final-closeout
        path: ${{ runner.temp }}/papers-final-closeout
        retention-days: 30
