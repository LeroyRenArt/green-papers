name: Papers final content readiness
on:
  push:
    branches: [pdf-production-proof-20261011]
    paths: [.github/workflows/papers-final-readiness.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 788c57781066e31e0d3aafde1c4adbc277cce1a9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check exact source, public build, preview and live baseline
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,json,hashlib,subprocess,traceback
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
