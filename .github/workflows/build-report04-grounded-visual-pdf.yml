name: Build Report 04 grounded visual PDF

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-report04-pdf:
    if: github.event.pull_request.head.ref == 'editorial/report04-grounded-visual-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Report 04 PDF
        run: node scripts/print_one_pdf.mjs papers/penguin-dashboard-legibility-as-governance.html pdf/penguin-dashboard-legibility-as-governance.pdf
      - name: Verify PDF signature
        run: |
          test -s pdf/penguin-dashboard-legibility-as-governance.pdf
          head -c 5 pdf/penguin-dashboard-legibility-as-governance.pdf | grep -q '%PDF-'
      - uses: actions/upload-artifact@v4
        with:
          name: report04-grounded-visual-pdf
          path: pdf/penguin-dashboard-legibility-as-governance.pdf
          retention-days: 1
          if-no-files-found: error
