          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2'
          ROWS=[{'path': 'da/laeseorientering.html', 'url': 'https://papers.spiralweb.earth/da/laeseorientering', 'kind': 'html', 'source_sha256': '33e0de5ae2b8d94079453c66d2629b506c63556766ac8842a19a6f0e5356919a', 'id': 0, 'http_status': 200, 'exit_code': 0, 'bytes': 10729, 'sha256': '33e0de5ae2b8d94079453c66d2629b506c63556766ac8842a19a6f0e5356919a', 'format_valid': True, 'remote_blob': {'sha': '0e4bdd68aca14c9acecd648a519dc063d50abe1a', 'size': 10729}, 'live_matches_remote_blob': True, 'source_matches': True, 'capture_ok': True, 'patches': [{'id': 0, 'old': '</a> — parallelle veje, ikke stadier.</li>', 'new': '</a> — Flow, friktion og følsomhed i kommunalt arbejde.</li>', 'finding': 'F3-01'}, {'id': 0, 'old': 'kandidat v0.5.1 · 6. oktober 2026', 'new': 'kandidat v0.5.2 · 11. oktober 2026', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 2}], 'candidate_sha256': '9845d221e4b38b825608959130875c21eca2d89994d2e860a9d4f8260c7d2937'}, {'path': 'papers/kommunalt-arbejde-som-natur.html', 'url': 'https://papers.spiralweb.earth/papers/kommunalt-arbejde-som-natur', 'kind': 'html', 'source_sha256': '2dd6e6eee40f86bd36c4a9b04284dca9a71e3fe377d98e959c10a9af70fea2c1', 'id': 1, 'http_status': 200, 'exit_code': 0, 'bytes': 237586, 'sha256': '2dd6e6eee40f86bd36c4a9b04284dca9a71e3fe377d98e959c10a9af70fea2c1', 'format_valid': True, 'remote_blob': {'sha': '40a5f56610dfc011ecbd5f50d9893cfdb88c1a7b', 'size': 237586}, 'live_matches_remote_blob': True, 'source_matches': True, 'capture_ok': True, 'patches': [{'id': 1, 'old': '<p>En kommune bør ikke vælge regneeksempel efter, hvilket der giver den største besparelse. Den skal vælge den beregningsform, der passer til arbejdsfeltets faktiske volumen, rytme og følsomhed.</p>', 'new': '', 'finding': 'F3-06'}, {'id': 1, 'old': 'Del V’s oplysninger om befolkning, budget, organisering og lokale resonanspunkter', 'new': 'Del VI’s oplysninger om befolkning, budget, organisering og lokale resonanspunkter', 'finding': 'F3-07'}, {'id': 1, '