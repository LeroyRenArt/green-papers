name: Papers seven HTML candidate browser control
on:
  push:
    branches: [pdf-production-proof-20261011]
    paths: [.github/workflows/papers-html-candidate-qa.yml]
permissions:
  contents: read
jobs:
  browser-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser version
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Compare seven baseline and candidate HTML pages
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,subprocess,os,mimetypes,re,html
          from urllib.parse import urlsplit,unquote
          from playwright.sync_api import sync_playwright
