sisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus.', 'finding': 'F3-08'}, {'id': 4, 'old': 'v0.1.2', 'new': 'v0.1.3', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 3}, {'id': 4, 'old': 'arbejdsudgave v0.1.3 · oktober 2026', 'new': 'arbejdsudgave v0.1.3 · 11. oktober 2026', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 2}, {'id': 4, 'old': '</head>', 'new': '<style data-sw-mobile-url-wrap="20261011">@media screen and (max-width:600px){main a[href^="https://"],main a[href^="http://"]{overflow-wrap:anywhere}}</style></head>', 'finding': 'MOBILE_URL_WRAP', 'kind': 'screen_css', 'count': 1}], 'candidate_sha256': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c'}, {'path': 'papers/the-spiral-of-hypotheses-full-register.html', 'url': 'https://papers.spiralweb.earth/papers/the-spiral-of-hypotheses-full-register', 'kind': 'html', 'source_sha256': '3ef15b8d232f4477319f4a24eb3f6d3edb6694ac0dbae3885ae14613770f3ef4', 'id': 5, 'http_status': 200, 'exit_code': 0, 'bytes': 97206, 'sha256': '3ef15b8d232f4477319f4a24eb3f6d3edb6694ac0dbae3885ae14613770f3ef4', 'format_valid': True, 'remote_blob': {'sha': '186390c5629acef69afccab0d8983d2d29993b48', 'size': 97206}, 'live_matches_remote_blob': True, 'source_matches': True, 'capture_ok': True, 'patches': [{'id': 5, 'old': '<strong>AnchorPoint — current public term.</strong> A real\nperson, group or relationship rooted in place with enough continuity for\nanother conversation. It is a relational threshold, not proof of an\nactive field cycle.', 'new': '<strong>AnchorPoint — current public term.</strong> An AnchorPoint is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle.', 'finding': 'F3-08'}, {'id': 5, 'old': 'A\nplace-based node in the wider web; broader than the relational threshold\nnamed by AnchorPoint.', 'new': 'A place-based node in the wider web. An AnchorPoint names a locally rooted shared form; an established relationship alone is neither that form nor an active field cycle.', 'finding': 'F3-08'}, {'id': 5, 'old': '<p><strong>H11 — Capacity before consent.</strong> Consent is meaningful\nonly when the nervous system is regulated; under threat, bodies comply\nwithout choosing. <em>GP16. Correction: freely-chosen durable consent\ngiven from acute dysregulation.</em></p>', 'new': '<p><strong>H11 — Capacity can widen the space for consent; rights remain under strain.</strong> Regulation and material safety can make choice more credible. Under threat, compliance may be mistaken for consent, but dysregulation does not remove a person’s dignity, voice, consent or authority over their own boundaries. Regulation must not become an entrance requirement for being heard. Sources: GP16 Nervous-System Love (v0.2); GP13 §4; GP18. <em>Correction: measures intended to support capacity making refusal harder, excluding people under strain, or increasing coercion rather than credible choice.</em></p>', 'finding': 'F3-10'}, {'id': 5, 'old': 'Full Working Register v0.8.2 · Spiralweb Papers', 'new': 'Full Working Register v0.8.3 · Spiralweb Papers', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 1}, {'id': 5, 'old': 'Full Working Register v0.8.2"', 'new': 'Full Working Register v0.8.3"', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 2}, {'id': 5, 'old': 'Public working register · v0.8.2 · 17 September 2026', 'new': 'Public working register · v0.8.3 · 11 October 2026', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 1}, {'id': 5, 'old': '</strong> · v0.8.2 · 17 September 2026<br>', 'new': '</strong> · v0.8.3 · 11 October 2026<br>', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 1}], 'candidate_sha256': '709088b7bfa416b9f92e8b1e1bfb7bc59aad574159c97bcb0332743725bcf6d3'}, {'path': 'papers/the-spiral-of-hypotheses.html', 'url': 'https://papers.spiralweb.earth/papers/the-spiral-of-hypotheses', 'kind': 'html', 'source_sha256': '6e9d38d521b590a7de7c813491ea571a16f90c0f7ac6b69928d216d69f970356', 'id': 6, 'http_status': 200, 'exit_code': 0, 'bytes': 45073, 'sha256': '6e9d38d521b590a7de7c813491ea571a16f90c0f7ac6b69928d216d69f970356', 'format_valid': True, 'remote_blob': {'sha': '9cc22e5e4d2da0fb1449828639cadef597230a36', 'size': 45073}, 'live_matches_remote_blob': True, 'source_matches': True, 'capture_ok': True, 'patches': [{'id': 6, 'old': 'The full internal register preserves', 'new': 'The full public working register preserves', 'finding': 'F3-09'}, {'id': 6, 'old': 'candidate v0.4', 'new': 'candidate v0.4.1', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 2}, {'id': 6, 'old': 'candidate v0.4.1 · 20 August 2026', 'new': 'candidate v0.4.1 · 11 October 2026', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 1}, {'id': 6, 'old': '</head>', 'new': '<style data-sw-mobile-url-wrap="20261011">@media screen and (max-width:600px){main a[href^="https://"],main a[href^="http://"]{overflow-wrap:anywhere}}</style></head>', 'finding': 'MOBILE_URL_WRAP', 'kind': 'screen_css', 'count': 1}], 'candidate_sha256': '24d1fd828f6b66de46ce6e2d466ccad730c4c79373530a1b1be4987090b402b0'}]
          sha=lambda b:hashlib.sha256(b).hexdigest()
          result={'status':'RUNNING','main':'235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2','cases':[],'production_ready':False}
          probe=r"""()=>{
          let all=[...document.querySelectorAll('*')];let main=document.querySelector('main')||document.body;let b=main.getBoundingClientRect(),s=getComputedStyle(main);
          return {width:innerWidth,overflow:document.documentElement.scrollWidth-innerWidth,font_status:document.fonts.status,main:{left:b.left,right:b.right,width:b.width,padding:s.padding,color:s.color,background:s.backgroundColor,font:s.fontFamily},links:[...document.querySelectorAll('a')].map(a=>[a.getAttribute('href'),a.getAttribute('aria-label')]),ids:all.filter(e=>e.id).map(e=>e.id),broken_fragments:[...document.querySelectorAll('a[href^="#"]')].map(a=>a.getAttribute('href').slice(1)).filter(x=>x&&!document.getElementById(decodeURIComponent(x))),images:[...document.images].map(x=>({src:x.getAttribute('src'),loaded:x.complete&&x.naturalWidth>0})),outside:[...main.querySelectorAll('*')].filter(e=>e.getClientRects().length&&getComputedStyle(e).position!=='fixed').map(e=>{let b=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,left:b.left,right:b.right,text:e.textContent.trim().slice(0,100)}}).filter(x=>x.right>innerWidth+1||x.left< -1).slice(0,80)};
          }"""
          def plain(s):return re.sub(r'\s+',' ',html.unescape(re.sub('<[^>]+>',' ',s))).strip()
          try:
           with sync_playwright() as pw:
            browser=pw.chromium.launch();result['browser']=browser.version
            for row in ROWS:
             original=(ROOT/row['path']).read_bytes();assert sha(original)==row['source_sha256']
             candidate=original.decode()
             for patch in row['patches']:
              assert candidate.count(patch['old'])==patch.get('count',1);candidate=candidate.replace(patch['old'],patch['new'],patch.get('count',1))
             assert sha(candidate.encode())==row['candidate_sha256']
             for width,height in [(1280,900),(390,844),(320,800)]:
              measurements={};errors={};missing={}
              for mode,data in [('baseline',original),('candidate',candidate.encode())]:
               context=browser.new_context(viewport={'width':width,'height':height});page=context.new_page();errors[mode]=[];missing[mode]=[]
               page.on('pageerror',lambda e:errors[mode].append(str(e)))
               def route(req):
                u=urlsplit(req.request.url)
                if u.hostname not in ('audit.local','papers.spiralweb.earth','green-papers.pages.dev'):
                 missing[mode].append(req.request.url);req.abort();return
                relative=unquote(u.path).lstrip('/') or 'index.html';f=ROOT/relative
                if not f.is_file():f=ROOT/(relative+'.html')
                if f.is_dir():f=f/'index.html'
                if relative==row['path']:req.fulfill(body=data,content_type='text/html; charset=utf-8');return
                if not f.is_file():missing[mode].append(relative);req.fulfill(status=404,body='missing');return
                req.fulfill(body=f.read_bytes(),content_type=mimetypes.guess_type(str(f))[0] or 'application/octet-stream')
               page.route('**/*',route);page.goto('http://audit.local/'+row['path']);page.evaluate('()=>document.fonts.ready');page.wait_for_timeout(100)
               measurements[mode]=page.evaluate(probe)
               if width!=320:
                page.screenshot(path=str(OUT/f'{row["id"]}-{width}-{mode}-top.png'))
                page.evaluate("()=>scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'})");page.screenshot(path=str(OUT/f'{row["id"]}-{width}-{mode}-bottom.png'))
               if mode=='candidate':
                edits=[]
                for i,patch in enumerate(row['patches']):
                 if patch.get('kind') in ('metadata','screen_css'):continue
                 if not patch['new']:edits.append({'finding':patch['finding'],'removed_duplicate':True});continue
                 text=plain(patch['new']); loc=page.locator('p,li,div').filter(has_text=text)
                 # Browser-normalised exact passage, avoiding ancestor matches.
                 found=page.evaluate("text=>{let n=s=>s.replace(/\\s+/g,' ').trim();return [...document.querySelectorAll('p,li,div')].filter(e=>n(e.textContent).includes(text)).sort((a,b)=>a.textContent.length-b.textContent.length).map(e=>({tag:e.tagName,id:e.id,text:n(e.textContent),box:{width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}})).slice(0,1)}",text)
                 assert found,'Missing approved passage '+patch['finding']
                 edits.append({'finding':patch['finding'],'present':True,'box':found[0]['box']})
                 if width!=320:
                  page.evaluate("text=>{let n=s=>s.replace(/\\s+/g,' ').trim();let e=[...document.querySelectorAll('p,li,div')].filter(e=>n(e.textContent).includes(text)).sort((a,b)=>a.textContent.length-b.textContent.length)[0];scrollTo({top:e.getBoundingClientRect().top+scrollY-(innerHeight-e.getBoundingClientRect().height)/2,behavior:'instant'})}",text)
                  page.screenshot(path=str(OUT/f'{row["id"]}-{width}-edit-{i}.png'))
                measurements[mode]['edits']=edits
               context.close()
              a=measurements['baseline'];b=measurements['candidate']
              result['cases'].append({'path':row['path'],'width':width,'baseline_sha256':row['source_sha256'],'candidate_sha256':row['candidate_sha256'],'measurements':measurements,'errors':errors,'missing':missing,'contracts_preserved':False})
              assert a['links']==b['links'] and a['ids']==b['ids'],'Link/id contract changed'
              assert a['main']==b['main'],'Main style geometry changed'
              assert b['overflow']==0,'Document overflow remains'
              assert errors['baseline']==errors['candidate'],'New JS error'
              assert missing['baseline']==missing['candidate'],'New missing resource'
              assert a['broken_fragments']==b['broken_fragments'],'New broken fragment'
              assert a['images']==b['images'],'Image behaviour changed'
              result['cases'][-1]['contracts_preserved']=True
            browser.close();result['status']='PASS_AUTOMATED_HTML_CONTRACTS_VISUAL_REVIEW_PENDING'
          except Exception as e:result['status']='STOP';result['error']=repr(e);raise
          finally:
           (OUT/'RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
           (OUT/'environment.txt').write_text(subprocess.check_output(['python','-m','pip','freeze'],text=True))
           m={str(p.relative_to(OUT)):sha(p.read_bytes()) for p in OUT.rglob('*') if p.is_file()};(OUT/'MANIFEST.json').write_text(json.dumps(m,indent=2))
           print('HTML_QA_RESULT '+json.dumps(result,ensure_ascii=False))
          PYCODE
      - name: Preserve browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: papers-seven-html-candidate-browser-control
          path: ${{ runner.temp }}/papers-html-qa
          retention-days: 30
          if-no-files-found: error
