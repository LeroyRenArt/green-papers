b7ab7411d2f9ba9c22f', 'size': 105655}, 'live_matches_remote_blob': True, 'source_matches': True, 'capture_ok': True, 'patches': [{'id': 3, 'old': 'Internet\naccess is not required.', 'new': 'The materials are available online. Once downloaded or printed, they can support fieldwork without an internet connection.', 'finding': 'F3-03'}, {'id': 3, 'old': 'An AnchorPoint is a relational threshold: a person, group, or\nconnection with enough continuity for another conversation.', 'new': 'An AnchorPoint is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle.', 'finding': 'F3-08'}, {'id': 3, 'old': 'This is an AnchorPoint, not necessarily an active\nfield.', 'new': 'This is an established relationship, not in itself an AnchorPoint or an active field cycle.', 'finding': 'F3-08'}, {'id': 3, 'old': 'An <strong>AnchorPoint</strong> is the relational threshold: a real\nperson, group, or relationship with enough place-based continuity for\nanother conversation.', 'new': 'An <strong>AnchorPoint</strong> is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle.', 'finding': 'F3-08'}, {'id': 3, 'old': 'v0.1.2', 'new': 'v0.1.3', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 3}, {'id': 3, 'old': 'working edition v0.1.3 · October 2026', 'new': 'working edition v0.1.3 · 11 October 2026', 'finding': 'CURRENT_REVISION', 'kind': 'metadata', 'count': 2}, {'id': 3, 'old': '</head>', 'new': '<style data-sw-mobi