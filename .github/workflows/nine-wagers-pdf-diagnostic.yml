name: Nine Wagers historical PDF diagnostic
on:
  push:
    branches: [pdf-production-proof-20261011]
    paths: [.github/workflows/nine-wagers-pdf-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Capture one unchanged historical PDF
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,subprocess,os
          import fitz
          ROOT=Path.cwd();OUT=Path(os.environ['RUNNER_TEMP'])/'nine-pdf-diagnostic';OUT.mkdir()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2'
          p=ROOT/'papers/the-spiral-of-hypotheses.pdf';b=p.read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='92b9115870568b35eccb9f058304dc94e4026bc3'
          (OUT/'baseline.pdf').write_bytes(b);d=fitz.open(p);rows=[]
          for i,page in enumerate(d):
           text=page.get_text();rows.append({'page':i+1,'text':text,'fonts':page.get_fonts(),'links':page.get_links()});page.get_pixmap(dpi=108,alpha=False).save(OUT/('page-'+str(i+1)+'.png'))
          r={'status':'READ_ONLY_CAPTURE','main':'235ba3e61948d3a1f8fd480e18cd5c95a47d8ce2','git_blob':'92b9115870568b35eccb9f058304dc94e4026bc3','sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'pages':len(d),'metadata':d.metadata,'page_rows':rows,'publication_attempts':0};(OUT/'RESULT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));print('NINE_PDF_RESULT '+json.dumps({k:v for k,v in r.items() if k!='page_rows'}));m={str(p.relative_to(OUT)):hashlib.sha256(p.read_bytes()).hexdigest() for p in OUT.rglob('*') if p.is_file()};(OUT/'MANIFEST.json').write_text(json.dumps(m,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nine-wagers-pdf-diagnostic
          path: ${{ runner.temp }}/nine-pdf-diagnostic
          retention-days: 30
          if-no-files-found: error
