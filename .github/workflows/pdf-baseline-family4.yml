name: Papers narrow hero clipping measurement
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 791ad03339fbf0bb1c555723f158ce67d6175dfa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check six live journeys, reflow, image loading and noJS email
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import os,json,hashlib,subprocess
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['RUNNER_TEMP'])/'family5-clipping';O.mkdir();H='791ad03339fbf0bb1c555723f158ce67d6175dfa'
          def ref(label):
           s=subprocess.check_output(['git','ls-remote','origin','refs/heads/main']).decode();(O/(label+'.txt')).write_text(s);assert s.split()[0]==H
          ref('main-before');out={'status':'MEASURED','source':H,'cases':[],'production_writes':0}
          with sync_playwright() as p:
           b=p.chromium.launch();out['browser_version']=b.version
           for w in [320,360,390,640,1280]:
            c=b.new_context(viewport={'width':w,'height':1000});page=c.new_page();response=page.goto('https://papers.spiralweb.earth/',wait_until='networkidle');assert response.status==200
            data=page.evaluate('''()=>{let rect=e=>{let r=e.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width}},lines=e=>{let r=document.createRange();r.selectNodeContents(e);return [...r.getClientRects()].map(r=>({left:r.left,right:r.right,width:r.width}))};let lead=document.querySelector('.hero .lead'),heading=document.querySelector('.hero h1');return {viewport:innerWidth,pageOverflow:document.documentElement.scrollWidth-innerWidth,hero:rect(document.querySelector('.hero')),shell:rect(document.querySelector('.hero .shell')),lead:rect(lead),leadLines:lines(lead),heading:rect(heading),headingLines:lines(heading),gridColumns:getComputedStyle(document.querySelector('.hero .shell')).gridTemplateColumns,heroOverflow:getComputedStyle(document.querySelector('.hero')).overflow,headingFont:getComputedStyle(heading).fontSize,leadFont:getComputedStyle(lead).fontSize}}''')
            data['lead_lines_beyond_viewport']=sum(r['right']>w+.5 for r in data['leadLines']);out['cases'].append(data);page.screenshot(path=str(O/f'papers-{w}.png'));c.close()
           b.close()
          ref('main-after');(O/'RESULT.json').write_text(json.dumps(out,indent=2));(O/'MANIFEST.json').write_text(json.dumps({x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in O.iterdir() if x.is_file()},indent=2))
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family5-clipping
          path: ${{ runner.temp }}/family5-clipping
          retention-days: 30
          if-no-files-found: error

