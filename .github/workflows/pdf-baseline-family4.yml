name: Papers homepage reflow and no-JS readiness
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 03deb498d07bc34e0a5ea2f88b0b109aca42d4f5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check exact source, text-line bounds, contact and navigation
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import os,json,hashlib,subprocess,traceback,ast,re
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['RUNNER_TEMP'])/'home-reflow-email';O.mkdir()
          B='791ad03339fbf0bb1c555723f158ce67d6175dfa';H='03deb498d07bc34e0a5ea2f88b0b109aca42d4f5';U='https://e761fdff.green-papers.pages.dev'
          result={'status':'RUNNING','base':B,'candidate':H,'preview':U,'cases':[],'production_writes':0}
          def command(args,label):
           r=subprocess.run(args,capture_output=True,text=True,timeout=60);(O/(label+'.stdout')).write_text(r.stdout);(O/(label+'.stderr')).write_text(r.stderr);(O/(label+'.command.json')).write_text(json.dumps({'args':args,'exit':r.returncode}));assert r.returncode==0;return r.stdout.strip()
          try:
           assert command(['git','rev-parse','HEAD'],'head')==H
           assert command(['git','ls-remote','origin','refs/heads/main'],'main-before').split()[0]==B
           assert command(['git','diff','--name-only',B,H],'diff-files')=='index.html'
           before=subprocess.check_output(['git','show',B+':index.html']).decode();after=Path('index.html').read_text()
           expected=before.replace('.hero .shell{grid-template-columns:1fr;min-height:auto}.spiral{width:330px}', '.hero .shell{grid-template-columns:minmax(0,1fr);min-height:auto}.spiral{width:min(330px,100%)}').replace('<a href="mailto:contact@spiralweb.earth">Corrections</a>','<!--email_off--><a href="mailto:contact@spiralweb.earth">Corrections</a><!--/email_off-->')
           assert after==expected
           (O/'candidate.diff').write_text(command(['git','diff',B,H,'--','index.html'],'diff'))
           public=json.loads(Path('public-files.json').read_text());command(['node','scripts/build_public.mjs'],'build')
           assert sorted(str(p.relative_to('dist')) for p in Path('dist').rglob('*') if p.is_file())==sorted(public)
           for f in public:assert Path(f).read_bytes()==(Path('dist')/f).read_bytes()
           result['public_build_files']=len(public)
           with sync_playwright() as pw:
            browser=pw.chromium.launch();result['browser_version']=browser.version
            for js in [True,False]:
             for w in [320,360,390,640,980,1280]:
              c=browser.new_context(viewport={'width':w,'height':1000},java_script_enabled=js);page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto(U+'/',wait_until='networkidle');assert response.status==200
              if js:page.evaluate('()=>document.fonts.ready')
              raw=response.body();(O/f'preview-{w}-{js}.html').write_bytes(raw)
              assert raw==Path('index.html').read_bytes(), 'preview body must equal exact source'
              assert page.get_by_role('link',name='Corrections',exact=True).get_attribute('href')=='mailto:contact@spiralweb.earth'
              data=page.evaluate('''()=>{let rect=e=>{let r=e.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width}},lines=e=>{let r=document.createRange();r.selectNodeContents(e);return [...r.getClientRects()].map(r=>({left:r.left,right:r.right,width:r.width}))};let lead=document.querySelector('.hero .lead'),heading=document.querySelector('.hero h1');return {viewport:innerWidth,overflow:document.documentElement.scrollWidth-innerWidth,lead:rect(lead),leadLines:lines(lead),headingLines:lines(heading),gridColumns:getComputedStyle(document.querySelector('.hero .shell')).gridTemplateColumns,orbits:[...document.querySelectorAll('.orbit')].map(e=>({text:e.textContent,rect:rect(e)}))}}''')
              data.update({'javascript':js,'errors':errors});result['cases'].append(data)
              assert data['overflow']==0 and not errors,data
              assert all(r['left']>=-.5 and r['right']<=w+.5 for r in data['leadLines']+data['headingLines']),data
              page.keyboard.press('Tab');assert page.locator('.skip-link').evaluate('(e)=>e===document.activeElement');page.keyboard.press('Enter');page.keyboard.press('Tab');assert page.evaluate('()=>document.activeElement.closest("main")!==null')
              data['skip_next_tab_within_main']=True
              page.screenshot(path=str(O/f'home-{w}-{js}.png'),full_page=True)
              page.get_by_role('link',name='Full library →',exact=True).click();assert page.url==U+'/library#collection';assert page.locator('#collection').is_visible();data['library_navigation']=True
              c.close()
            browser.close()
           assert command(['git','ls-remote','origin','refs/heads/main'],'main-after').split()[0]==B
           result['status']='PASS'
          except Exception as e:
           result.update({'status':'STOP','error':str(e),'traceback':traceback.format_exc()});raise
          finally:
           (O/'RESULT.json').write_text(json.dumps(result,indent=2));(O/'MANIFEST.json').write_text(json.dumps({x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in O.iterdir() if x.is_file()},indent=2))
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-reflow-email
          path: ${{ runner.temp }}/home-reflow-email
          retention-days: 30
          if-no-files-found: error
