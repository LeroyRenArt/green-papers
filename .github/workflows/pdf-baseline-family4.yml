af introducerede karper og niltilapia', 'after_text': 'Maeda-Obregón m.fl. (2025) finder, at miljø-DNA-aflæsninger domineres af introducerede karper og tilapia (Oreochromis)', 'group': 'F4A-ECO-01'}], 'papers/den-regenerative-kommune.html': [{'site': 'Papers', 'path': 'papers/den-regenerative-kommune.html', 'location': 'After the AI Act dates paragraph, retaining K5–K7 citations', 'source_sha256': '763dd62439ca26e2ff1d37b6744fb4912db88cf99aa0fe01d63d0e46ca02d9a7', 'before_html': '<p>AI-forordningen trådte i kraft den 1. august 2024. Regler om AI-færdigheder og de oprindelige forbudte praksisser har fundet anvendelse siden 2. februar 2025. Størstedelen af reglerne, herunder artikel 50’s specifikke transparenskrav, finder anvendelse fra 2. august 2026. Digital Omnibus flyttede de centrale højrisikokrav for bilag III-systemer til 2. december 2027 og for bilag I-systemer til 2. august 2028. <a href="https://eur-lex.europa.eu/eli/reg/2024/1689/oj">[K5]</a> <a href="https://eur-lex.europa.eu/eli/reg/2026/1744/oj">[K6]</a> <a href="https://digst.dk/tilsyn/ai-forordningen/ai-omnibus/">[K7]</a></p>', 'after_html': '<p>AI-forordningen trådte i kraft den 1. august 2024. Regler om AI-færdigheder og de oprindelige forbudte praksisser har fundet anvendelse siden 2. februar 2025. Størstedelen af reglerne, herunder artikel 50’s specifikke transparenskrav, finder anvendelse fra 2. august 2026. Digital Omnibus flyttede de centrale højrisikokrav for bilag III-systemer til 2. december 2027 og for bilag I-systemer til 2. august 2028. <a href="https://eur-lex.europa.eu/eli/reg/2024/1689/oj">[K5]</a> <a href="https://eur-lex.europa.eu/eli/reg/2026/1744/oj">[K6]</a> <a href="https://digst.dk/tilsyn/ai-forordningen/ai-omnibus/">[K7]</a></p>\n<p>For udbydere af generative AI-systemer, som er markedsført før 2. august 2026, gælder dog en overgangsfrist til 2. december 2026 for artikel 50, stk. 2’s krav om maskinlæsbar mærkning.</p>', 'before_text': 'AI-forordningen trådte i kraft den 1. august 2024. Regler om AI-færdigheder og de oprindelige forbudte praksisser har fundet anvendelse siden 2. februar 2025. Størstedelen af reglerne, herunder artikel 50’s specifikke transparenskrav, finder anvendelse fra 2. august 2026. Digital Omnibus flyttede de centrale højrisikokrav for bilag III-systemer til 2. december 2027 og for bilag I-systemer til 2. august 2028. [K5] [K6] [K7]', 'after_text': 'AI-forordningen trådte i kraft den 1. august 2024. Regler om AI-færdigheder og de oprindelige forbudte praksisser har fundet anvendelse siden 2. februar 2025. Størstedelen af reglerne, herunder artikel 50’s specifikke transparenskrav, finder anvendelse fra 2. august 2026. Digital Omnibus flyttede de centrale højrisikokrav for bilag III-systemer til 2. december 2027 og for bilag I-systemer til 2. august 2028. [K5] [K6] [K7] For udbydere af generative AI-systemer, som er markedsført før 2. august 2026, gælder dog en overgangsfrist til 2. december 2026 for artikel 50, stk. 2’s krav om maskinlæsbar mærkning.', 'group': 'F4A-LAW-01'}], 'papers/the-regenerative-municipality.html': [{'site': 'Papers', 'path': 'papers/the-regenerative-municipality.html', 'location': 'After the AI Act dates paragraph, retaining K5–K7 citations', 'source_sha256': '0a4ca6b370f9c26702ae2caa42939206bc6a0f18c1b6fb879aed871ebfbad0b7', 'before_html': '<p>The AI Act entered into force on 1 August 2024. Rules on AI literacy and the original prohibited practices have applied since 2 February 2025. Most of the rules, including the specific transparency requirements in Article 50, apply from 2 August 2026. The Digital Omnibus moved the principal high-risk requirements for Annex III systems to 2 December 2027 and for Annex I systems to 2 August 2028. <a href="https://eur-lex.europa.eu/eli/reg/2024/1689/oj">[K5]</a> <a href="https://eur-lex.europa.eu/eli/reg/2026/1744/oj">[K6]</a> <a href="https://digst.dk/tilsyn/ai-forordningen/ai-omnibus/">[K7]</a></p>', 'after_html': '<p>The AI Act entered into force on 1 August 2024. Rules on AI literacy and the original prohibited practices have applied since 2 February 2025. Most of the rules, including the specific transparency requirements in Article 50, apply from 2 August 2026. The Digital Omnibus moved the principal high-risk requirements for Annex III systems to 2 December 2027 and for Annex I systems to 2 August 2028. <a href="https://eur-lex.europa.eu/eli/reg/2024/1689/oj">[K5]</a> <a href="https://eur-lex.europa.eu/eli/reg/2026/1744/oj">[K6]</a> <a href="https://digst.dk/tilsyn/ai-forordningen/ai-omnibus/">[K7]</a></p>\n<p>Providers of generative AI systems placed on the market before 2 August 2026 have until 2 December 2026 to comply with Article 50(2)’s machine-readable marking requirement.</p>', 'before_text': 'The AI Act entered into force on 1 August 2024. Rules on AI literacy and the original prohibited practices have applied since 2 February 2025. Most of the rules, including the specific transparency requirements in Article 50, apply from 2 August 2026. The Digital Omnibus moved the principal high-risk requirements for Annex III systems to 2 December 2027 and for Annex I systems to 2 August 2028. [K5] [K6] [K7]', 'after_text': 'The AI Act entered into force on 1 August 2024. Rules on AI literacy and the original prohibited practices have applied since 2 February 2025. Most of the rules, including the specific transparency requirements in Article 50, apply from 2 August 2026. The Digital Omnibus moved the principal high-risk requirements for Annex III systems to 2 December 2027 and for Annex I systems to 2 August 2028. [K5] [K6] [K7] Providers of generative AI systems placed on the market before 2 August 2026 have until 2 December 2026 to comply with Article 50(2)’s machine-readable marking requirement.', 'group': 'F4A-LAW-01'}], 'da/ai-menneskeligt-ansvar.html': [{'site': 'Papers', 'path': 'da/ai-menneskeligt-ansvar.html', 'location': 'Immediately after heading En menneskeholdt relationel workbench, before Denne praksis’ kontinuitet', 'source_sha256': 'aa1f901873f88fa35efe74acd0ef50b7e2a58ac20625550c155aae76ba3af89d', 'before_html': '<h2>En menneskeholdt relationel workbench</h2>', 'after_html': '<h2>En menneskeholdt relationel workbench</h2>\n<p>Hvis du vil begynde i praksis, tilbyder <a href="/toolbox/ai-in-right-relationship/">AI in Right Relationship?</a> en starter, du kan kopiere, og seks små værktøjer sammen med en beskrivelse af vores digitale workbench og en invitation til samtale. En kontinuitetsnote er én lille del af dette bredere arbejdsarrangement.</p>', 'before_text': 'En menneskeholdt relationel workbench', 'after_text': 'En menneskeholdt relationel workbench Hvis du vil begynde i praksis, tilbyder AI in Right Relationship? en starter, du kan kopiere, og seks små værktøjer sammen med en beskrivelse af vores digitale workbench og en invitation til samtale. En kontinuitetsnote er én lille del af dette bredere arbejdsarrangement.', 'group': 'F4B-ENTRY-01'}], 'papers/atlas-of-a-living-architecture.html': [{'site': 'Papers', 'path': 'papers/atlas-of-a-living-architecture.html', 'location': 'Chapter4 Observation before intervention', 'source_sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'before_html': 'Spiralweb begins fieldwork with a compact movement:', 'after_html': 'A first shared inquiry can begin with a compact movement:', 'before_text': 'Spiralweb begins fieldwork with a compact movement:', 'after_text': 'A first shared inquiry can begin with a compact movement:', 'group': 'F4B-ATLAS-01'}, {'site': 'Papers', 'path': 'papers/atlas-of-a-living-architecture.html', 'location': 'Chapter5 Practice regulates the architecture; first paragraph only', 'source_sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'before_html': 'A field is not a laboratory in which people and places become test\nsubjects for an already completed theory. Practice may show that a\nconcept does not translate, that a tool creates more work for a local\nsteward than it releases, or that a different financing form protects\nthe field better. It may also show that a distinction helps people\nidentify a hidden cost or stop a damaging movement.', 'after_html': 'A field is not a laboratory in which people and places become test subjects for an already completed theory.', 'before_text': 'A field is not a laboratory in which people and places become test subjects for an already completed theory. Practice may show that a concept does not translate, that a tool creates more work for a local steward than it releases, or that a different financing form protects the field better. It may also show that a distinction helps people identify a hidden cost or stop a damaging movement.', 'after_text': 'A field is not a laboratory in which people and places become test subjects for an already completed theory.', 'group': 'F4B-ATLAS-02'}, {'site': 'Papers', 'path': 'papers/atlas-of-a-living-architecture.html', 'location': '', 'source_sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'before_html': '<p>Situated knowledge derives strength from proximity to consequence,\nbut proximity does not erase perspective. External knowledge may reveal\nstructures that everyday practice cannot see; it too is shaped by\ninstruments, categories, time horizons, and institutional position.\nResponsible inquiry arises through encounter among partial positions,\nnot through the victory of one scale over another.</p>', 'after_html': '', 'before_text': 'Situated knowledge derives strength from proximity to consequence, but proximity does not erase perspective. External knowledge may reveal structures that everyday practice cannot see; it too is shaped by instruments, categories, time horizons, and institutional position. Responsible inquiry arises through encounter among partial positions, not through the victory of one scale over another.', 'after_text': '[Afsnittet udgår]', 'group': 'F4E-ATLAS-01'}, {'site': 'Papers', 'path': 'papers/atlas-of-a-living-architecture.html', 'location': '', 'source_sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'before_html': '<p>An <strong>AnchorPoint</strong> is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A <strong>field</strong> is the operational\nsurface on which relationship, shared question, action, evidence status,\nand next decision can be described. An AnchorPoint does not\nautomatically activate a field.</p>', 'after_html': '<p>An <strong>AnchorPoint</strong> is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A <strong>field</strong> is the operational\nsurface on which relationship, shared question, action, evidence status,\nand next decision can be described. </p>', 'before_text': 'An AnchorPoint is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A field is the operational surface on which relationship, shared question, action, evidence status, and next decision can be described. An AnchorPoint does not automatically activate a field.', 'after_text': 'An AnchorPoint is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A field is the operational surface on which relationship, shared question, action, evidence status, and next decision can be described.', 'group': 'F4E-ATLAS-02'}], 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html': [{'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': 'Kortere indgange; anchor only', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<a href="https://spiralweb.earth/cafes/sofia/short-reads/a-decent-economy/">Foretrækker du en kortere indgang? Læs den engelske Short Read →</a>', 'after_html': '<a href="https://spiralweb.earth/da/korte-laesninger/en-anstaendig-oekonomi-under-livets-jurisdiktion/">Foretrækker du en kortere indgang? Læs den danske korte læsning →</a>', 'before_text': 'Foretrækker du en kortere indgang? Læs den engelske Short Read →', 'after_text': 'Foretrækker du en kortere indgang? Læs den danske korte læsning →', 'group': 'F4B-ECON-01'}, {'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': '', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<p>Den økonomiske grammatik holder forskellige relationer adskilt. Læringsarkitekturen gør hypoteserne korrigerbare. Membranen regulerer passagen mellem kapitalens, institutionernes og de levende felters forskellige logikker. Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.</p>', 'after_html': '<p>Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.</p>', 'before_text': 'Den økonomiske grammatik holder forskellige relationer adskilt. Læringsarkitekturen gør hypoteserne korrigerbare. Membranen regulerer passagen mellem kapitalens, institutionernes og de levende felters forskellige logikker. Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.', 'after_text': 'Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.', 'group': 'F4E-ECON-01'}, {'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': '', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<p>AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste konsekvente bevægelse—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.</p>', 'after_html': '<p>AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste bevægelse med konsekvenser—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.</p>', 'before_text': 'AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste konsekvente bevægelse—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.', 'after_text': 'AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste bevægelse med konsekvenser—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.', 'group': 'F4E-ECON-02'}, {'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': '', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<p>Produktivitetsgevinsten er virkelig. Men dens samfundsmæssige betydning afhænger af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af en anden overgang.</p>', 'after_html': '<p>Produktivitetsgevinsten kan være reel, men afhænger af opgaven og betingelserne. Dens samfundsmæssige betydning afhænger også af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af en anden overgang.</p>', 'before_text': 'Produktivitetsgevinsten er virkelig. Men dens samfundsmæssige betydning afhænger af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af en anden overgang.', 'after_text': 'Produktivitetsgevinsten kan være reel, men afhænger af opgaven og betingelserne. Dens samfundsmæssige betydning afhænger også af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af en anden overgang.', 'group': 'F4E-AI-01'}], 'papers/den-nye-faelled.html': [{'site': 'Papers', 'path': 'papers/den-nye-faelled.html', 'location': '', 'source_sha256': '4810d1cfccbd803bde7accc788fe2a5bdca7c9fe2bdf74f8c8b08ddd4431cf54', 'before_html': '<p>Der er også et mere kropsligt lag her, som moderne samfund ofte undervurderer. Mennesker mærker faktisk i kroppen, hvad der giver liv, og hvad der tager fra liv. Aggression, overtryk, konstant konflikt og brutalitet sætter sig ikke kun som meninger, men som biologisk belastning. Når feltet bliver for hårdt, mister mennesker både nuancer og åndedrag. Derfor er fred ikke kun et moralsk ideal. Det er også en reguleringsform.</p>', 'after_html': '<p>Der er også et mere kropsligt lag her, som moderne samfund ofte undervurderer. Mennesker kan mærke noget af det, der nærer eller udmatter dem, i kroppen. Aggression, overtryk, konstant konflikt og brutalitet er ikke blot spørgsmål om holdning; de kan også belaste kroppen. Når et felt bliver for hårdt, kan mennesker miste både nuancer og åndedrag. Fred er derfor en moralsk stræben med en kropslig dimension: muligheden for at falde til ro nok til at forblive til stede.</p>', 'before_text': 'Der er også et mere kropsligt lag her, som moderne samfund ofte undervurderer. Mennesker mærker faktisk i kroppen, hvad der giver liv, og hvad der tager fra liv. Aggression, overtryk, konstant konflikt og brutalitet sætter sig ikke kun som meninger, men som biologisk belastning. Når feltet bliver for hårdt, mister mennesker både nuancer og åndedrag. Derfor er fred ikke kun et moralsk ideal. Det er også en reguleringsform.', 'after_text': 'Der er også et mere kropsligt lag her, som moderne samfund ofte undervurderer. Mennesker kan mærke noget af det, der nærer eller udmatter dem, i kroppen. Aggression, overtryk, konstant konflikt og brutalitet er ikke blot spørgsmål om holdning; de kan også belaste kroppen. Når et felt bliver for hårdt, kan mennesker miste både nuancer og åndedrag. Fred er derfor en moralsk stræben med en kropslig dimension: muligheden for at falde til ro nok til at forblive til stede.', 'group': 'F4B-FAELLED-01'}, {'site': 'Papers', 'path': 'papers/den-nye-faelled.html', 'location': '§18, third fragment', 'source_sha256': '4810d1cfccbd803bde7accc788fe2a5bdca7c9fe2bdf74f8c8b08ddd4431cf54', 'before_html': 'Men sorg som en nødvendig del af enhver levende korrektion.', 'after_html': 'Men sorg som en mulig og vigtig del af en levende korrektion.', 'before_text': 'Men sorg som en nødvendig del af enhver levende korrektion.', 'after_text': 'Men sorg som en mulig og vigtig del af en levende korrektion.', 'group': 'F4B-FAELLED-02'}, {'site': 'Papers', 'path': 'papers/den-nye-faelled.html', 'location': '§18, hosting paragraph', 'source_sha256': '4810d1cfccbd803bde7accc788fe2a5bdca7c9fe2bdf74f8c8b08ddd4431cf54', 'before_html': 'Hvis folkekirken skal blive feltholder for grøn omstilling, levende jord og fredelig samskabelse, må den også kunne være feltholder for lament. Ikke som endnu en prædiken om lidelse, men som et rum, hvor mennesker faktisk kan ånde, græde, tie, lytte og være sammen i det, der gør ondt, uden at blive skubbet videre for hurtigt.', 'after_html': 'Hvis folkekirken skal blive feltholder for grøn omstilling, levende jord og fredelig samskabelse, må den også kunne være feltholder for lament. Ikke som endnu en prædiken om lidelse, men som et rum, hvor mennesker faktisk kan ånde, græde, tie, lytte og være sammen i det, der gør ondt, uden at blive skubbet videre for hurtigt. Der skal være plads til sorg for dem, der har brug for det; deltagelse kræver ikke, at man sørger eller deler noget privat.', 'before_text': 'Hvis folkekirken skal blive feltholder for grøn omstilling, levende jord og fredelig samskabelse, må den også kunne være feltholder for lament. Ikke som endnu en prædiken om lidelse, men som et rum, hvor mennesker faktisk kan ånde, græde, tie, lytte og være sammen i det, der gør ondt, uden at blive skubbet videre for hurtigt.', 'after_text': 'Hvis folkekirken skal blive feltholder for grøn omstilling, levende jord og fredelig samskabelse, må den også kunne være feltholder for lament. Ikke som endnu en prædiken om lidelse, men som et rum, hvor mennesker faktisk kan ånde, græde, tie, lytte og være sammen i det, der gør ondt, uden at blive skubbet videre for hurtigt. Der skal være plads til sorg for dem, der har brug for det; deltagelse kræver ikke, at man sørger eller deler noget privat.', 'group': 'F4B-FAELLED-02'}, {'site': 'Papers', 'path': 'papers/den-nye-faelled.html', 'location': '§18, pull quote; aligns with existing EN can', 'source_sha256': '4810d1cfccbd803bde7accc788fe2a5bdca7c9fe2bdf74f8c8b08ddd4431cf54', 'before_html': 'Lament er ikke modsætningen til handling. Lament er det, der gør handling mere sand.', 'after_html': 'Lament er ikke modsætningen til handling. Lament kan gøre handling mere sand.', 'before_text': 'Lament er ikke modsætningen til handling. Lament er det, der gør handling mere sand.', 'after_text': 'Lament er ikke modsætningen til handling. Lament kan gøre handling mere sand.', 'group': 'F4B-FAELLED-02'}, {'site': 'Papers', 'path': 'papers/den-nye-faelled.html', 'location': '§16, insertion in existing economy paragraph', 'source_sha256': '4810d1cfccbd803bde7accc788fe2a5bdca7c9fe2bdf74f8c8b08ddd4431cf54', 'before_html': 'Økologisk fremgang kan ikke opveje udmattede mennesker;', 'after_html': 'Vedvarende drift og ansvar må ikke stiltiende forudsættes båret frivilligt. Før et forsøg begynder, skal de berørte aftale, hvilke funktioner der er frivillige, hvilke der kræver løn eller kontraktbetaling, og hvordan midlerne skaffes. Økologisk fremgang kan ikke opveje udmattede mennesker;', 'before_text': 'Økologisk fremgang kan ikke opveje udmattede mennesker;', 'after_text': 'Vedvarende drift og ansvar må ikke stiltiende forudsættes båret frivilligt. Før et forsøg begynder, skal de berørte aftale, hvilke funktioner der er frivillige, hvilke der kræver løn eller kontraktbetaling, og hvordan midlerne skaffes. Økologisk fremgang kan ikke opveje udmattede mennesker;', 'group': 'F4B-FAELLED-03'}], 'papers/den-nye-faelled-en.html': [{'site': 'Papers', 'path': 'papers/den-nye-faelled-en.html', 'location': '§18, third fragment', 'source_sha256': '4c5b4b06d485e2bd41a173496f0c3bc3323e7272e9cb904f2fa9f241c7970898', 'before_html': 'But grief as a necessary part of any living correction.', 'after_html': 'But grief as a possible and important part of living correction.', 'before_text': 'But grief as a necessary part of any living correction.', 'after_text': 'But grief as a possible and important part of living correction.', 'group': 'F4B-FAELLED-02'}, {'site': 'Papers', 'path': 'papers/den-nye-faelled-en.html', 'location': '§18, hosting paragraph', 'source_sha256': '4c5b4b06d485e2bd41a173496f0c3bc3323e7272e9cb904f2fa9f241c7970898', 'before_html': 'If the Church of Denmark is to become a holder of space for green transition, living soil, and peaceful co-creation, it must also be able to hold space for lament. Not as another sermon about suffering, but as a space where people can breathe, weep, be silent, listen, and stay together with what hurts, without being hurried onward.', 'after_html': 'If the Church of Denmark is to become a holder of space for green transition, living soil, and peaceful co-creation, it must also be able to hold space for lament. Not as another sermon about suffering, but as a space where people can breathe, weep, be silent, listen, and stay together with what hurts, without being hurried onward. There should be room for grief for those who need it; participation does not require grieving or sharing anything private.', 'before_text': 'If the Church of Denmark is to become a holder of space for green transition, living soil, and peaceful co-creation, it must also be able to hold space for lament. Not as another sermon about suffering, but as a space where people can breathe, weep, be silent, listen, and stay together with what hurts, without being hurried onward.', 'after_text': 'If the Church of Denmark is to become a holder of space for green transition, living soil, and peaceful co-creation, it must also be able to hold space for lament. Not as another sermon about suffering, but as a space where people can breathe, weep, be silent, listen, and stay together with what hurts, without being hurried onward. There should be room for grief for those who need it; participation does not require grieving or sharing anything private.', 'group': 'F4B-FAELLED-02'}, {'site': 'Papers', 'path': 'papers/den-nye-faelled-en.html', 'location': '§16, insertion in existing economy paragraph', 'source_sha256': '4c5b4b06d485e2bd41a173496f0c3bc3323e7272e9cb904f2fa9f241c7970898', 'before_html': 'Ecological improvement cannot cancel out human exhaustion;', 'after_html': 'Ongoing care and responsibility must not silently be assumed to rely on volunteers. Before a trial begins, those concerned should agree which functions are voluntary, which require wages or contractual payment, and how the funds will be secured. Ecological improvement cannot cancel out human exhaustion;', 'before_text': 'Ecological improvement cannot cancel out human exhaustion;', 'after_text': 'Ongoing care and responsibility must not silently be assumed to rely on volunteers. Before a trial begins, those concerned should agree which functions are voluntary, which require wages or contractual payment, and how the funds will be secured. Ecological improvement cannot cancel out human exhaustion;', 'group': 'F4B-FAELLED-03'}], 'papers/rule-of-life-da.html': [{'site': 'Papers', 'path': 'papers/rule-of-life-da.html', 'location': 'Closing diagnostic; final paragraph', 'source_sha256': '17eb0472c7008cb2ed502aad91d6c764968348d30ba79f1d59b2c88fae1894a1', 'before_html': 'hvis AI indsnævrer, hvis erfaringer der tæller', 'after_html': 'hvis AI indsnævrer, hvilke erfaringer der tæller', 'before_text': 'hvis AI indsnævrer, hvis erfaringer der tæller', 'after_text': 'hvis AI indsnævrer, hvilke erfaringer der tæller', 'group': 'F4B-RULE-01'}, {'site': 'Papers', 'path': 'papers/rule-of-life-da.html', 'location': '', 'source_sha256': '17eb0472c7008cb2ed502aad91d6c764968348d30ba79f1d59b2c88fae1894a1', 'before_html': '<p>Planetary Stewardship Economy forstås bedst som en syntese og operationalisering, ikke som et krav om at erstatte eksisterende alternative økonomiske traditioner. Dens særlige bevægelse er at spørge, hvordan livsunderstøttende stewardship kan blive tilstrækkeligt læseligt til at guide penge, lov, governance, teknologi og reciprocitet uden at overgive feltet til nogen af dem.</p>', 'after_html': '', 'before_text': 'Planetary Stewardship Economy forstås bedst som en syntese og operationalisering, ikke som et krav om at erstatte eksisterende alternative økonomiske traditioner. Dens særlige bevægelse er at spørge, hvordan livsunderstøttende stewardship kan blive tilstrækkeligt læseligt til at guide penge, lov, governance, teknologi og reciprocitet uden at overgive feltet til nogen af dem.', 'after_text': '[Afsnittet udgår]', 'group': 'F4E-RULE-01'}], 'papers/eve-adam-and-the-penguins-da.html': [{'site': 'Papers', 'path': 'papers/eve-adam-and-the-penguins-da.html', 'location': 'Del VI, §18, afsnittet om mobil og stedbunden kapacitet', 'source_sha256': 'e6932e6c141b1501d383191deec868c5d733d204a59928c6b804557069715302', 'before_html': 'Det er et spørgsmål om gensidighed på tværs af ulige forhold til stedet.', 'after_html': 'Det er ikke et argument imod mobilitet. Det er et spørgsmål om gensidighed på tværs af ulige forhold til stedet.', 'before_text': 'Det er et spørgsmål om gensidighed på tværs af ulige forhold til stedet.', 'after_text': 'Det er ikke et argument imod mobilitet. Det er et spørgsmål om gensidighed på tværs af ulige forhold til stedet.', 'group': 'F4B-EVE-01'}], 'papers/kommunalt-arbejde-som-natur.html': [{'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '902', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': '<p>Om relation bør forstås som en selvstændig dimension eller et muligt trettende lag i den bredere 13×13-ramme, forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader selve lagdiskussionen til <em>Knowing From the Ground</em> og den videre metodeudvikling.</p>', 'after_html': '<p>Relation kan være en tværgående undersøgelsesfunktion eller en selvstændig dimension i en afgrænset 13×13-form. Hvordan den bedst indgår, afhænger af undersøgelsens formål og forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader den konkrete udformning til <em>Knowing From the Ground</em> og den videre metodeudvikling.</p>', 'before_text': 'Om relation bør forstås som en selvstændig dimension eller et muligt trettende lag i den bredere 13×13-ramme, forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader selve lagdiskussionen til Knowing From the Ground og den videre metodeudvikling.', 'after_text': 'Relation kan være en tværgående undersøgelsesfunktion eller en selvstændig dimension i en afgrænset 13×13-form. Hvordan den bedst indgår, afhænger af undersøgelsens formål og forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader den konkrete udformning til Knowing From the Ground og den videre metodeudvikling.', 'group': 'F4B-WORK-01'}, {'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '1528', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': 'læses som et egenskab ved hele arbejdsfeltet', 'after_html': 'læses som en egenskab ved hele arbejdsfeltet', 'before_text': 'læses som et egenskab ved hele arbejdsfeltet', 'after_text': 'læses som en egenskab ved hele arbejdsfeltet', 'group': 'F4B-WORK-02'}, {'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': '<section class="level3" id="to-korte-workshopvarianter">\n<h4>To korte workshopvarianter</h4>\n<p>De fulde eksempler ovenfor kan i en tidlig workshop suppleres af to enklere miniatureberegninger.</p>\n<p><strong>Relationel kontinuitet</strong></p>\n<p>En AI-understøttet søge- og dokumentationspraksis reducerer samlet søge-, overleverings- og dokumentationstid med 300 timer om året.</p>\n<p>Implementering, lokal tilpasning, faglig kontrol og vedligeholdelse binder 80 timer.</p>\n<blockquote>\n<p>300 timer − 80 timer = 220 timers mulig netto-G1.</p>\n</blockquote>\n<p>Kommunen kan beslutte at reinvestere alle 220 timer i beskyttet overlap, opfølgning på ændringer i borgerens tilstand, kendte relationer omkring særligt følsomme borgere og læring fra fejl og afvigelser.</p>\n<p>Det traditionelle besparelsesregnskab viser ingen kontant gevinst. Det arbejdsøkologiske regnskab viser 220 timers kapacitet, som er flyttet fra administrativ friktion til relationel og faglig kvalitet.</p>\n<blockquote>\n<p><strong>Reinvesteringen er ikke et tab af gevinsten. Den er den måde, gevinsten bliver til feltomsorg.</strong></p>\n</blockquote>\n<p><strong>Høj følsomhed</strong></p>\n<p>Et afgrænset forløb kan skabe 70 timers dokumenteret netto-G1 og samtidig vise hurtigere korrektion af faktuelle fejl, færre perioder uden synlig ansvarsholder, bedre forståelse af næste skridt og én mulig undgået alvorlig eskalation.</p>\n<p>De 70 timer kan dokumenteres. Den mulige undgåede eskalation kan ikke uden videre prissættes eller registreres som realiseret G2. Materialet kan sandsynliggøre en forbindelse, men ikke bevise, hvad der ellers ville være sket.</p>\n<p>Eksemplet viser, hvorfor et højfølsomt felt ikke skal vurderes gennem samme produktivitetsprocent som et højvolumenfelt. En lille G1 kan ledsages af stor offentlig værdi gennem bedre rettigheder, tidligere reaktion og mindre risiko for alvorlig skade.</p>\n</section>', 'after_html': '<section class="level3" id="to-korte-workshopvarianter">\n<h4>To korte workshopvarianter</h4>\n<p>Til en tidlig workshop kan eksemplerne B og C ovenfor forenkles, så nettokorrektion, reinvestering i relationel kvalitet og usikkerheden om mulig G2 stadig fremgår.</p>\n</section>', 'before_text': 'To korte workshopvarianter De fulde eksempler ovenfor kan i en tidlig workshop suppleres af to enklere miniatureberegninger. Relationel kontinuitet En AI-understøttet søge- og dokumentationspraksis reducerer samlet søge-, overleverings- og dokumentationstid med 300 timer om året. Implementering, lokal tilpasning, faglig kontrol og vedligeholdelse binder 80 timer. 300 timer − 80 timer = 220 timers mulig netto-G1. Kommunen kan beslutte at reinvestere alle 220 timer i beskyttet overlap, opfølgning på ændringer i borgerens tilstand, kendte relationer omkring særligt følsomme borgere og læring fra fejl og afvigelser. Det traditionelle besparelsesregnskab viser ingen kontant gevinst. Det arbejdsøkologiske regnskab viser 220 timers kapacitet, som er flyttet fra administrativ friktion til relationel og faglig kvalitet. Reinvesteringen er ikke et tab af gevinsten. Den er den måde, gevinsten bliver til feltomsorg. Høj følsomhed Et afgrænset forløb kan skabe 70 timers dokumenteret netto-G1 og samtidig vise hurtigere korrektion af faktuelle fejl, færre perioder uden synlig ansvarsholder, bedre forståelse af næste skridt og én mulig undgået alvorlig eskalation. De 70 timer kan dokumenteres. Den mulige undgåede eskalation kan ikke uden videre prissættes eller registreres som realiseret G2. Materialet kan sandsynliggøre en forbindelse, men ikke bevise, hvad der ellers ville være sket. Eksemplet viser, hvorfor et højfølsomt felt ikke skal vurderes gennem samme produktivitetsprocent som et højvolumenfelt. En lille G1 kan ledsages af stor offentlig værdi gennem bedre rettigheder, tidligere reaktion og mindre risiko for alvorlig skade.', 'after_text': 'To korte workshopvarianter Til en tidlig workshop kan eksemplerne B og C ovenfor forenkles, så nettokorrektion, reinvestering i relationel kvalitet og usikkerheden om mulig G2 stadig fremgår.', 'group': 'F4E-WORK-01'}, {'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': '<p>Det, der må transformeres, er:</p>\n<ul>\n<li>blind dokumentation;</li>\n<li>fragmentering;</li>\n<li>skjult byrdeforskydning;</li>\n<li>kontrol uden læring;</li>\n<li>budgetmæssig suboptimering;</li>\n<li>teknologi som automatisk intensivering;</li>\n<li>reformer uden returvej.</li>\n</ul>\n<p>Det, der skal bæres gennem transformationen, er:</p>\n<ul>\n<li>universelle rettigheder;</li>\n<li>solidaritet;</li>\n<li>faglighed;</li>\n<li>menneskelig værdighed;</li>\n<li>demokratisk legitimitet;</li>\n<li>offentlig ansvarsbæring;</li>\n<li>institutionel hukommelse;</li>\n<li>retten til korrektion;</li>\n<li>og den enkeltes ret til ikke at blive gjort transparent.</li>\n</ul>', 'after_html': '<p>De skadelige former skal forandres, mens rettigheder, solidaritet, faglighed og demokratisk ansvar bæres videre. Afsnit 9.1–9.2 udfolder, hvad der skal transformeres, og hvad der skal beskyttes.</p>', 'before_text': 'Det, der må transformeres, er: blind dokumentation; fragmentering; skjult byrdeforskydning; kontrol uden læring; budgetmæssig suboptimering; teknologi som automatisk intensivering; reformer uden returvej. Det, der skal bæres gennem transformationen, er: universelle rettigheder; solidaritet; faglighed; menneskelig værdighed; demokratisk legitimitet; offentlig ansvarsbæring; institutionel hukommelse; retten til korrektion; og den enkeltes ret til ikke at blive gjort transparent.', 'after_text': 'De skadelige former skal forandres, mens rettigheder, solidaritet, faglighed og demokratisk ansvar bæres videre. Afsnit 9.1–9.2 udfolder, hvad der skal transformeres, og hvad der skal beskyttes.', 'group': 'F4E-WORK-02'}], 'papers/municipal-work-as-nature.html': [{'site': 'Papers', 'path': 'papers/municipal-work-as-nature.html', 'location': '902', 'source_sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'before_html': '<p>Whether relationship should be understood as an independent dimension or a possible thirteenth layer in the wider 13×13 framework remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the discussion of layers itself to <em>Knowing From the Ground</em> and further methodological development.</p>', 'after_html': '<p>Relationship may be a cross-cutting inquiry function or an independent dimension within a bounded 13×13 form. How it is best included depends on the purpose of the inquiry and remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the specific design to <em>Knowing From the Ground</em> and further methodological development.</p>', 'before_text': 'Whether relationship should be understood as an independent dimension or a possible thirteenth layer in the wider 13×13 framework remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the discussion of layers itself to Knowing From the Ground and further methodological development.', 'after_text': 'Relationship may be a cross-cutting inquiry function or an independent dimension within a bounded 13×13 form. How it is best included depends on the purpose of the inquiry and remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the specific design to Knowing From the Ground and further methodological development.', 'group': 'F4B-WORK-01'}, {'site': 'Papers', 'path': 'papers/municipal-work-as-nature.html', 'location': '', 'source_sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'before_html': '<section id="two-short-workshop-variants" class="level3">\n<h4>Two Short Workshop Variants</h4>\n<p>The full examples above can be supplemented in an early workshop by two simpler miniature calculations.</p>\n<p><strong>Relational continuity</strong></p>\n<p>An AI-assisted search and documentation practice reduces total search, handover, and documentation time by 300 hours a year.</p>\n<p>Implementation, local adaptation, professional control, and maintenance bind 80 hours.</p>\n<blockquote>\n<p>300 hours − 80 hours = 220 hours of possible net G1.</p>\n</blockquote>\n<p>The municipality may decide to reinvest all 220 hours in protected overlap, follow-up on changes in the citizen’s condition, known relationships around particularly sensitive citizens, and learning from errors and deviations.</p>\n<p>The traditional savings account shows no cash gain. The work-ecological account shows 220 hours of capacity moved from administrative friction to relational and professional quality.</p>\n<blockquote>\n<p><strong>Reinvestment is not a loss of the gain. It is the way the gain becomes field care.</strong></p>\n</blockquote>\n<p><strong>High sensitivity</strong></p>\n<p>A bounded pathway can create 70 hours of documented net G1 while also showing faster correction of factual errors, fewer periods without a visible responsibility-holder, better understanding of the next step, and one possibly avoided serious escalation.</p>\n<p>The 70 hours can be documented. The possibly avoided escalation cannot automatically be priced or registered as realised G2. The material can render a connection plausible, but cannot prove what would otherwise have happened.</p>\n<p>The example shows why a highly sensitive field should not be assessed by the same productivity percentage as a high-volume field. A small G1 may be accompanied by great public value through better rights, earlier response, and lower risk of serious harm.</p>\n</section>', 'after_html': '<section id="two-short-workshop-variants" class="level3">\n<h4>Two Short Workshop Variants</h4>\n<p>For an early workshop, examples B and C above can be simplified while retaining net correction, reinvestment in relational quality, and uncertainty about possible G2.</p>\n</section>', 'before_text': 'Two Short Workshop Variants The full examples above can be supplemented in an early workshop by two simpler miniature calculations. Relational continuity An AI-assisted search and documentation practice reduces total search, handover, and documentation time by 300 hours a year. Implementation, local adaptation, professional control, and maintenance bind 80 hours. 300 hours − 80 hours = 220 hours of possible net G1. The municipality may decide to reinvest all 220 hours in protected overlap, follow-up on changes in the citizen’s condition, known relationships around particularly sensitive citizens, and learning from errors and deviations. The traditional savings account shows no cash gain. The work-ecological account shows 220 hours of capacity moved from administrative friction to relational and professional quality. Reinvestment is not a loss of the gain. It is the way the gain becomes field care. High sensitivity A bounded pathway can create 70 hours of documented net G1 while also showing faster correction of factual errors, fewer periods without a visible responsibility-holder, better understanding of the next step, and one possibly avoided serious escalation. The 70 hours can be documented. The possibly avoided escalation cannot automatically be priced or registered as realised G2. The material can render a connection plausible, but cannot prove what would otherwise have happened. The example shows why a highly sensitive field should not be assessed by the same productivity percentage as a high-volume field. A small G1 may be accompanied by great public value through better rights, earlier response, and lower risk of serious harm.', 'after_text': 'Two Short Workshop Variants For an early workshop, examples B and C above can be simplified while retaining net correction, reinvestment in relational quality, and uncertainty about possible G2.', 'group': 'F4E-WORK-01'}, {'site': 'Papers', 'path': 'papers/municipal-work-as-nature.html', 'location': '', 'source_sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'before_html': '<p>What must be transformed is:</p>\n<ul>\n<li>blind documentation;</li>\n<li>fragmentation;</li>\n<li>hidden displacement of burden;</li>\n<li>control without learning;</li>\n<li>budgetary suboptimisation;</li>\n<li>technology as automatic intensification;</li>\n<li>reforms without a return route.</li>\n</ul>\n<p>What must be carried through the transformation is:</p>\n<ul>\n<li>universal rights;</li>\n<li>solidarity;</li>\n<li>professional practice;</li>\n<li>human dignity;</li>\n<li>democratic legitimacy;</li>\n<li>public accountability;</li>\n<li>institutional memory;</li>\n<li>the right to correction;</li>\n<li>and the individual’s right not to be made transparent.</li>\n</ul>', 'after_html': '<p>Harmful forms must change while rights, solidarity, professional judgement, and democratic responsibility are carried forward. Sections 9.1–9.2 set out what must be transformed and what must be protected.</p>', 'before_text': 'What must be transformed is: blind documentation; fragmentation; hidden displacement of burden; control without learning; budgetary suboptimisation; technology as automatic intensification; reforms without a return route. What must be carried through the transformation is: universal rights; solidarity; professional practice; human dignity; democratic legitimacy; public accountability; institutional memory; the right to correction; and the individual’s right not to be made transparent.', 'after_text': 'Harmful forms must change while rights, solidarity, professional judgement, and democratic responsibility are carried forward. Sections 9.1–9.2 set out what must be transformed and what must be protected.', 'group': 'F4E-WORK-02'}], 'papers/atlas-over-en-levende-arkitektur.html': [{'site': 'Papers', 'path': 'papers/atlas-over-en-levende-arkitektur.html', 'location': '', 'source_sha256': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c', 'before_html': '<p>Et <strong>AnchorPoint</strong> er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et <strong>felt</strong> er den operationelle\noverflade, hvor relation, fælles spørgsmål, handling, evidensstatus og\nnæste beslutning kan beskrives. Et AnchorPoint aktiverer ikke automatisk\net felt.</p>', 'after_html': '<p>Et <strong>AnchorPoint</strong> er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et <strong>felt</strong> er den operationelle\noverflade, hvor relation, fælles spørgsmål, handling, evidensstatus og\nnæste beslutning kan beskrives. </p>', 'before_text': 'Et AnchorPoint er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et felt er den operationelle overflade, hvor relation, fælles spørgsmål, handling, evidensstatus og næste beslutning kan beskrives. Et AnchorPoint aktiverer ikke automatisk et felt.', 'after_text': 'Et AnchorPoint er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et felt er den operationelle overflade, hvor relation, fælles spørgsmål, handling, evidensstatus og næste beslutning kan beskrives.', 'group': 'F4E-ATLAS-02'}, {'site': 'Papers', 'path': 'papers/atlas-over-en-levende-arkitektur.html', 'location': '', 'source_sha256': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c', 'before_html': '<p>Generativ AI gør denne situation mere synlig. Den kan sammenfatte,\noversætte, kode, visualisere og organisere materiale i et tempo, som\nændrer forholdet mellem tid, kompetence og produktion.\nProduktivitetsgevinsten er virkelig, selv når kvaliteten fortsat kræver\nmenneskelig læsning og ansvar.</p>', 'after_html': '<p>Generativ AI gør denne situation mere synlig. Den kan sammenfatte,\noversætte, kode, visualisere og organisere materiale i et tempo, som\nændrer forholdet mellem tid, kompetence og produktion.\nDer kan være en reel produktivitetsgevinst, men kvaliteten kræver fortsat menneskelig læsning og ansvar.</p>', 'before_text': 'Generativ AI gør denne situation mere synlig. Den kan sammenfatte, oversætte, kode, visualisere og organisere materiale i et tempo, som ændrer forholdet mellem tid, kompetence og produktion. Produktivitetsgevinsten er virkelig, selv når kvaliteten fortsat kræver menneskelig læsning og ansvar.', 'after_text': 'Generativ AI gør denne situation mere synlig. Den kan sammenfatte, oversætte, kode, visualisere og organisere materiale i et tempo, som ændrer forholdet mellem tid, kompetence og produktion. Der kan være en reel produktivitetsgevinst, men kvaliteten kræver fortsat menneskelig læsning og ansvar.', 'group': 'F4E-AI-01'}], 'papers/a-decent-economy-under-the-jurisdiction-of-life.html': [{'site': 'Papers', 'path': 'papers/a-decent-economy-under-the-jurisdiction-of-life.html', 'location': '', 'source_sha256': '220ba7ea88f0f5fbf952c1c113ffa89e73141820b26ee91f6c30f200e33f083e', 'before_html': '<p>The economic grammar keeps different relationships distinct. The learning architecture makes the hypotheses correctable. The membrane regulates passage between the different logics of capital, institutions, and living fields. Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.</p>', 'after_html': '<p>Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.</p>', 'before_text': 'The economic grammar keeps different relationships distinct. The learning architecture makes the hypotheses correctable. The membrane regulates passage between the different logics of capital, institutions, and living fields. Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.', 'after_text': 'Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.', 'group': 'F4E-ECON-01'}, {'site': 'Papers', 'path': 'papers/a-decent-economy-under-the-jurisdiction-of-life.html', 'location': '', 'source_sha256': '220ba7ea88f0f5fbf952c1c113ffa89e73141820b26ee91f6c30f200e33f083e', 'before_html': '<p>The productivity gain is real. But its social meaning depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.</p>', 'after_html': '<p>The productivity gain may be real, but depends on the task and conditions. Its social meaning also depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.</p>', 'before_text': 'The productivity gain is real. But its social meaning depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.', 'after_text': 'The productivity gain may be real, but depends on the task and conditions. Its social meaning also depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.', 'group': 'F4E-AI-01'}], 'papers/rule-of-life.html': [{'site': 'Papers', 'path': 'papers/rule-of-life.html', 'location': '', 'source_sha256': 'e8ce0a93560fac642b0d443c89624bff319a8dadb364f9ecb0addc95316f4d7b', 'before_html': '<p>The Planetary Stewardship Economy is best