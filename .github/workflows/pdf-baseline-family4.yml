          for n,c in enumerate(CASES):
           print('CASE',n+1,c['pdf'],flush=True);folder=OUT/(str(n+1)+'-'+Path(c['pdf']).stem);folder.mkdir();item={k:v for k,v in c.items() if k!='css'}
           try:
