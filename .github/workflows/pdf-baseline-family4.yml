      - name: Test desktop, mobile, keyboard, anchors and PDF bytes
        run: |
          cat > "$RUNNER_TEMP/browser-test/browser-review.cjs" <<'JS'
          const fs=require('fs'),path=require('path'),http=require('http'),crypto=require('crypto');
          const {chromium}=require('playwright');const OUT=path.join(process.env.RUNNER_TEMP,'papers-browser-proof'),ROOT=path.join(process.env.GITHUB_WORKSPACE,'source'),STAGE=path.join(OUT,'stage');const scope=JSON.parse(fs.readFileSync(path.join(OUT,'scope.json')));const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const mime={'.html':'text/html; charset=utf-8','.css':'text/css','.js':'text/javascript','.pdf':'application/pdf','.png':'image/png','.webp':'image/webp','.svg':'image/svg+xml','.woff2':'font/woff2','.ico':'image/x-icon'};
          function resolve(root,raw){let n=decodeURIComponent(new URL(raw,'http://127.0.0.1').pathname);let p=path.resolve(root,'.'+n);if(!p.startsWith(root+path.sep)&&p!==root)return null;for(const candidate of [p,p+'.html',path.join(p,'index.html')])if(fs.existsSync(candidate)&&fs.statSync(candidate).isFile())return candidate;return null;}
          async function server(root){const s=http.createServer((req,res)=>{let p=resolve(root,req.url);if(!p){res.writeHead(404);res.end('Not found');return;}res.writeHead(200,{'Content-Type':mime[path.extname(p)]||'application/octet-stream'});res.end(fs.readFileSync(p));});await new Promise(r=>s.listen(0,'127.0.0.1',r));return s;}
          (async()=>{const baseline=await server(ROOT),candidate=await server(STAGE);const baseURL='http://127.0.0.1:'+baseline.address().port,candidateURL='http://127.0.0.1:'+candidate.address().port;const browser=await chromium.launch({headless:true});const report={result:'RUNNING',source_main:'23d1e46e619f843e0f74dd318ef50e4e96ad7f79',browser:browser.version(),playwright:require('playwright/package.json').version,viewports:[1440,390,360],cases:[],pdf_downloads:[],keyboard:[],anchor_journeys:[],failures:[],screenshots_saved_to_library:false,production_ready:false};
          try{
           for(const width of report.viewports){for(const d of scope.documents){let observations={};for(const phase of ['baseline','candidate']){const root=phase==='baseline'?ROOT:STAGE;const origin=phase==='baseline'?baseURL:candidateURL;const context=await browser.newContext({viewport:{width,height:1000}});const page=await context.newPage();const errors=[],missing=[];page.on('pageerror',e=>errors.push(String(e)));page.on('response',r=>{if(r.status()>=400)missing.push({url:r.url(),status:r.status()});});await context.route('**/*',async route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1')return route.continue();if(['papers.spiralweb.earth','green-papers.pages.dev'].includes(u.hostname)){const p=resolve(root,u.href);if(p)return route.fulfill({status:200,contentType:mime[path.extname(p)]||'application/octet-stream',body:fs.readFileSync(p)});}return route.abort();});await page.goto(origin+'/'+d.path.replace(/\.html$/,''),{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);
            const geometry=await page.evaluate(()=>({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,h1:[...document.querySelectorAll('h1')].map(e=>e.innerText),main:!!document.querySelector('main'),ids:[...document.querySelectorAll('[id]')].map(e=>e.id),brokenInternal:[...document.querySelectorAll('a[href^="#"]')].filter(a=>a.getAttribute('href').length>1&&!document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)))).map(a=>a.getAttribute('href')),brokenImages:[...document.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),overflowing:[...document.querySelectorAll('main p,main li,main h1,main h2,main h3,header h1,.meta-grid,.sitebar')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>innerWidth+2}).slice(0,12).map(e=>({tag:e.tagName,text:e.innerText.slice(0,120),right:e.getBoundingClientRect().right})),links:[...document.querySelectorAll('a[href]')].map(a=>({text:a.innerText,href:a.getAttribute('href')}))}));observations[phase]={geometry,errors,missing};
            if(phase==='candidate'){
             if(errors.length||missing.length||geometry.brokenInternal.length||geometry.brokenImages.length)report.failures.push({width,path:d.path,kind:'candidate_page_error',errors,missing,brokenInternal:geometry.brokenInternal,brokenImages:geometry.brokenImages});
             if(width===390||width===1440){await page.screenshot({path:path.join(OUT,d.path.replaceAll('/','__')+'-'+width+'.png'),fullPage:false});}
             if(width===1440){await page.keyboard.press('Tab');let focus=await page.evaluate(()=>({className:document.activeElement.className,tag:document.activeElement.tagName,href:document.activeElement.getAttribute('href'),opacity:getComputedStyle(document.activeElement).opacity}));await page.keyboard.press('Enter');let target=await page.evaluate(()=>({id:document.activeElement.id,hash:location.hash}));report.keyboard.push({path:d.path,focus,target,pass:focus.href==='#main-content'&&target.id==='main-content'});if(!(focus.href==='#main-content'&&target.id==='main-content'))report.failures.push({path:d.path,kind:'skiplink_keyboard',focus,target});
              const anchor=await page.evaluate(()=>[...document.querySelectorAll('a[href^="#"]:not(.sw-access-skip)')].map(a=>({text:a.innerText,href:a.getAttribute('href')})).find(a=>a.href.length>1));if(anchor){await page.locator('a[href="'+anchor.href+'"]').first().click();let observed=await page.evaluate(()=>({hash:location.hash,target:document.getElementById(decodeURIComponent(location.hash.slice(1)))?.getBoundingClientRect().top}));report.anchor_journeys.push({path:d.path,anchor,observed,pass:decodeURIComponent(observed.hash)===decodeURIComponent(anchor.href)});if(decodeURIComponent(observed.hash)!==decodeURIComponent(anchor.href))report.failures.push({path:d.path,kind:'anchor_navigation',anchor,observed});}
             }
            }
            await context.close();}
           const b=observations.baseline.geometry,c=observations.candidate.geometry;const newOverflow=c.documentWidth>width+2&&c.documentWidth>b.documentWidth+2;const h1Match=JSON.stringify(b.h1)===JSON.stringify(c.h1);if(newOverflow||!h1Match)report.failures.push({path:d.path,width,kind:newOverflow?'new_horizontal_overflow':'title_changed',baseline:b.documentWidth,candidate:c.documentWidth});report.cases.push({path:d.path,width,baseline_width:b.documentWidth,candidate_width:c.documentWidth,baseline_existing_overflow:b.documentWidth>width+2,candidate_overflow:c.documentWidth>width+2,new_overflow:newOverflow,h1_unchanged:h1Match,main:c.main,baseline_errors:observations.baseline.errors,candidate_errors:observations.candidate.errors,baseline_missing:observations.baseline.missing,candidate_missing:observations.candidate.missing,broken_internal:c.brokenInternal,overflowing:c.overflowing,links:c.links});console.log('CASE',d.path,width,c.documentWidth);}}
           const context=await browser.newContext();const request=context.request;for(const p of scope.pdfs){const response=await request.get(candidateURL+'/'+p.path);const body=await response.body();const record={path:p.path,status:response.status(),mime:response.headers()['content-type'],sha256:sha(body),expected_sha256:p.sha256,pass:response.status()===200&&sha(body)===p.sha256&&body.slice(0,5).toString()==='%PDF-'};report.pdf_downloads.push(record);if(!record.pass)report.failures.push({kind:'pdf_download_identity',...record});}await context.close();
           report.result=report.failures.length?'BROWSER_REVIEW_FINDINGS':'BROWSER_AUTOMATED_REVIEW_PASS_VISUAL_REVIEW_PENDING';
          }catch(e){report.result='STOP';report.error=String(e);throw e;}finally{fs.writeFileSync(path.join(OUT,'RESULT.json'),JSON.stringify(report,null,2));await browser.close();baseline.close();candidate.close();}
          })().catch(e=>{console.error(String(e));process.exitCode=1;});
          JS
          node "$RUNNER_TEMP/browser-test/browser-review.cjs"
      - name: Preserve scoped source identity and machine-readable evidence
