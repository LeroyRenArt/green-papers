name: Papers WeasyPrint structural calibration
on:
  push:
    branches: [audit/pdf-tags-weasy-calibration-20261014]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  baseline-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f5bf08325f86ac5d4a2dd85d19b6e68ebeda1692
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded dependency versions
        run: |
          sudo apt-get update
          sudo apt-get install -y 'libpango-1.0-0=1.52.1+ds-1build1' 'libpangoft2-1.0-0=1.52.1+ds-1build1' 'fonts-dejavu-core=2.37-8' 'fonts-urw-base35=20200910-8'
          cat > "$RUNNER_TEMP/pdf-requirements.lock" <<'LOCK'
          brotli==1.2.0
          cffi==2.1.1
          cssselect2==0.10.1
          fonttools==4.66.1
          pillow==12.3.0
          pycparser==3.11
          pydyf==0.12.1
          PyMuPDF==1.26.6
          pyphen==0.18.1
          tinycss2==1.5.1
          tinyhtml5==2.1.0
          weasyprint==70.0
          webencodings==0.6.1
          zopfli==0.4.3
          LOCK
          python -m pip install -r "$RUNNER_TEMP/pdf-requirements.lock"
      - name: Compare 23 existing PDFs and add tags only after exact baseline
        run: |
          cat > "$RUNNER_TEMP/weasy-tags.py" <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
