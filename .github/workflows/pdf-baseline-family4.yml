name: Bounded keyboard runtime callback compatibility probe
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8035e789ebff9327c891408f7fdceb43cca49dde
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check exact source, text-line bounds, contact and navigation
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import asyncio,json,os,hashlib
          from playwright.async_api import async_playwright
          O=Path(os.environ['RUNNER_TEMP'])/'keyboard-runtime-probe';O.mkdir()
          async def main():
           result=[]
           async with async_playwright() as pw:
            b=await pw.chromium.launch()
            for js in [True,False]:
             c=await b.new_context(java_script_enabled=js);p=await c.new_page();await p.goto('data:text/html,<a href="%23main">Skip</a><main id="main"><a href="%23hello">Hello</a></main>');row={'javascript':js}
             row['sync_evaluate']=await p.evaluate('()=>document.querySelectorAll("a").length')
             try:row['raf']=await asyncio.wait_for(p.evaluate('()=>new Promise(r=>requestAnimationFrame(()=>r("fired")))'),timeout=3)
             except asyncio.TimeoutError:row['raf']='TIMEOUT'
             await p.keyboard.press('Tab');row['external_wait_focus']=await p.evaluate('()=>document.activeElement.textContent');result.append(row);await c.close()
            await b.close()
           (O/'RESULT.json').write_text(json.dumps(result,indent=2));(O/'MANIFEST.json').write_text(json.dumps({x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in O.iterdir()},indent=2));print(json.dumps(result))
          asyncio.run(main())
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyboard-runtime-probe
          path: ${{ runner.temp }}/keyboard-runtime-probe
          retention-days: 30
          if-no-files-found: error
