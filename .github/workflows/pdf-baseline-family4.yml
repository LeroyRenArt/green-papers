name: Family5 complete keyboard sequence and focus measurement
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8035e789ebff9327c891408f7fdceb43cca49dde
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check exact source, text-line bounds, contact and navigation
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,json,hashlib,subprocess,traceback,time
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['RUNNER_TEMP'])/'family5-keyboard';O.mkdir();H='8035e789ebff9327c891408f7fdceb43cca49dde';P='https://papers.spiralweb.earth';M='https://spiralweb.earth'
          result={'status':'RUNNING','timestamp_utc':datetime.now(timezone.utc).isoformat(),'papers_main':H,'cases':[],'findings':[],'production_writes':0}
          def ref(label):
           r=subprocess.run(['git','ls-remote','origin','refs/heads/main'],capture_output=True,text=True,timeout=60);(O/(label+'.txt')).write_text(r.stdout);assert r.returncode==0 and r.stdout.split()[0]==H
          setup='''()=>{let es=[...document.querySelectorAll('a[href],button,input:not([type="hidden"]),select,textarea,summary,[tabindex]')].filter(e=>e.tabIndex>=0&&!e.disabled&&e.getClientRects().length&&getComputedStyle(e).visibility==='visible'&&!e.closest('[inert]')&&(()=>{for(let d=e.parentElement;d;d=d.parentElement)if(d.tagName==='DETAILS'&&!d.open&&e!==d.querySelector(':scope > summary'))return false;return true})());es.sort((a,b)=>{let x=a.tabIndex,y=b.tabIndex;return (x>0&&y>0)?x-y:x>0?-1:y>0?1:0});window.__auditFocus=es;window.__auditActual=[];return es.map((e,i)=>({i,tag:e.tagName,id:e.id,text:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||e.value||'').trim().slice(0,150),href:e.getAttribute('href'),tabIndex:e.tabIndex}))}'''
          probe='''()=>{let e=document.activeElement,i=window.__auditFocus.indexOf(e),r=e.getBoundingClientRect(),s=getComputedStyle(e);let x=Math.max(0,Math.min(innerWidth-1,(r.left+r.right)/2)),y=Math.max(0,Math.min(innerHeight-1,(r.top+r.bottom)/2)),hit=document.elementFromPoint(x,y);let k=window.__auditActual.indexOf(e);if(k<0){k=window.__auditActual.length;window.__auditActual.push(e)};let visible=[...e.getClientRects()].some(q=>{let l=Math.max(1,q.left),r=Math.min(innerWidth-1,q.right),t=Math.max(1,q.top),b=Math.min(innerHeight-1,q.bottom);if(l>=r||t>=b)return false;return [.2,.5,.8].some(z=>{let a=document.elementFromPoint(l+(r-l)*z,t+(b-t)*z);return a===e||e.contains(a)})});return {i,key:k,visiblePart:visible,tag:e.tagName,id:e.id,text:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||e.value||'').trim().slice(0,150),rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height},outline:s.outline,outlineOffset:s.outlineOffset,boxShadow:s.boxShadow,border:s.border,background:s.backgroundColor,focusVisible:e.matches(':focus-visible'),centerHit:hit===e||e.contains(hit),inMain:!!e.closest('main')}}'''
          def settle(page):
           old=None;stable=0;start=time.monotonic();samples=0
           while time.monotonic()-start<3:
            v=page.evaluate('()=>{let r=document.activeElement.getBoundingClientRect();return [r.left,r.right,r.top,r.bottom,scrollX,scrollY]}');samples+=1
            stable=stable+1 if v==old else 0;old=v
            if stable>=4:return {'stable':True,'samples':samples,'elapsed_ms':round((time.monotonic()-start)*1000)}
            page.wait_for_timeout(16)
           return {'stable':False,'samples':samples,'elapsed_ms':round((time.monotonic()-start)*1000)}
          try:
           ref('main-before')
           with sync_playwright() as pw:
            b=pw.chromium.launch();result['browser_version']=b.version
            pages=[('papers',P+'/'),('library',P+'/library'),('ai_tools',P+'/toolbox/ai-in-right-relationship/'),('da_orientation',P+'/da/laeseorientering'),('association',M+'/association/'),('support',M+'/support/'),('ledger',M+'/pg-ledger/'),('da_foyer',M+'/da/'),('short_reads',M+'/cafes/sofia/short-reads/')]
            for js in [True,False]:
             for w in [1280,390]:
              for name,url in pages:
               c=b.new_context(viewport={'width':w,'height':1000},java_script_enabled=js);p=c.new_page();case={'page':name,'url':url,'width':w,'javascript':js,'forward':[],'reverse':[],'flags':[]}
               try:
                response=p.goto(url,wait_until='networkidle');assert response.status==200;assert p.locator('h1').first.is_visible();case['final_url']=p.url;case['body_sha256']=hashlib.sha256(response.body()).hexdigest();(O/f'{name}-{w}-{js}.html').write_bytes(response.body())
                if js:p.evaluate('()=>document.fonts.ready')
                expected=p.evaluate(setup);case['expected']=expected;assert expected
                first=None;seen=set()
                for step in range(600):
                 p.keyboard.press('Tab');settled=settle(p);state=p.evaluate(probe);state['scroll_settled']=settled
                 if state['tag']=='BODY':continue
                 if first is None:first=state['key']
                 elif state['key']==first:break
                 elif state['key'] in seen:case['flags'].append({'kind':'premature_cycle','step':step,'state':state});break
                 seen.add(state['key']);case['forward'].append(state)
                 if not settled['stable']:case['flags'].append({'kind':'scroll_unsettled','step':step})
                 if not state['focusVisible']:case['flags'].append({'kind':'no_focus_visible','step':step})
                 if not state['visiblePart']:case['flags'].append({'kind':'fully_obscured','step':step,'state':state})
                 if ' none ' in state['outline']:case['flags'].append({'kind':'outline_none_review','step':step,'state':state})
                else:case['flags'].append({'kind':'cycle_limit'})
                covered={x['i'] for x in case['forward'] if x['i']>=0};case['missing_expected']=[x for x in expected if x['i'] not in covered]
                if case['missing_expected']:case['flags'].append({'kind':'missing_expected','controls':case['missing_expected']})
                reverse_expected=[x['key'] for x in reversed(case['forward'][1:])];ri=0
                for step in range(600):
                 p.keyboard.press('Shift+Tab');settle(p);state=p.evaluate(probe)
                 if state['tag']=='BODY':continue
                 if state['key']==first:break
                 case['reverse'].append(state)
                 if ri>=len(reverse_expected) or state['key']!=reverse_expected[ri]:case['flags'].append({'kind':'reverse_mismatch','step':step,'state':state});break
                 ri+=1
                case['reverse_complete']=ri==len(reverse_expected)
                if not case['reverse_complete']:case['flags'].append({'kind':'reverse_incomplete'})
                for flag in case['flags'][:3]:
                 st=flag.get('state')
                 if st:
                  p.evaluate('(k)=>window.__auditActual[k].focus()',st['key']);settle(p);p.screenshot(path=str(O/f"focus-{name}-{w}-{js}-{flag['step']}.png"))
                p.goto(url,wait_until='networkidle');p.keyboard.press('Tab');first=p.evaluate('()=>document.activeElement.getAttribute("href")');assert first and first.startswith('#');p.keyboard.press('Enter');p.keyboard.press('Tab');assert p.evaluate('()=>!!document.activeElement.closest("main")');case['skip_bypass']=True
                case['status']='MEASURED_WITH_REVIEW_FLAGS' if case['flags'] else 'PASS_SEQUENCE_FOCUS'
               except Exception as e:case['status']='PROBE_STOP';case['error']=str(e);result['findings'].append({'page':name,'width':w,'javascript':js,'error':str(e)})
               result['cases'].append(case);c.close();(O/'RESULT.json').write_text(json.dumps(result,indent=2));print(json.dumps({'completed_case':len(result['cases']),'page':name,'width':w,'javascript':js,'controls':len(case['forward']),'flags':len(case['flags'])}),flush=True)
            b.close()
           ref('main-after');result['status']='MEASURED_REQUIRES_REVIEW';result['run_id']=os.environ['GITHUB_RUN_ID'];result['control_commit']=os.environ['GITHUB_SHA']
          except Exception as e:result.update({'status':'STOP','error':str(e),'traceback':traceback.format_exc()});raise
          finally:
           (O/'RESULT.json').write_text(json.dumps(result,indent=2));(O/'MANIFEST.json').write_text(json.dumps({x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in O.iterdir() if x.is_file()},indent=2))
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family5-keyboard
          path: ${{ runner.temp }}/family5-keyboard
          retention-days: 30
          if-no-files-found: error
