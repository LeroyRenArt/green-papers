             HTML(filename=str(html),base_url='https://papers.spiralweb.earth/'+c['html'],url_fetcher=f).write_pdf(candidate,stylesheets=[CSS(string=c['css'],font_config=fc)],font_config=fc,pdf_tags=True)
             cand=inspect(candidate);assert same(prod,cand),'Tagged render changed'
             with fitz.open(candidate) as d:
              root=d.pdf_catalog();st=d.xref_get_key(root,'StructTreeRoot');assert st[0]=='xref',st
              struct=int(st[1].split()[0]);assert d.xref_get_key(struct,'ParentTree')[0]=='xref'
              lang=d.xref_get_key(root,'Lang')[1];assert lang in ('en','da'),lang
              roles={}
              import re
              for x in range(1,d.xref_length()):
               for role in re.findall(r'/S /([A-Za-z0-9]+)',d.xref_object(x)) :roles[role]=roles.get(role,0)+1
              assert roles.get('H1',0)>0 and roles.get('P',0)>0,roles
              assert d.xref_get_key(root,'MarkInfo/Marked')[1]=='true'
              for pg in [0,len(d)//2,len(d)-1]:d[pg].get_pixmap(alpha=False).save(folder/('candidate-page-'+str(pg+1)+'.png'))
             item.update(status='CANDIDATE_EXACT_REVIEW_REQUIRED',candidate_sha256=sha(candidate.read_bytes()),candidate_blob=blob(candidate.read_bytes()),roles=roles,lang=lang,candidate_exact=True)
            (folder/'comparison.json').write_text(json.dumps({'production':prod,'baseline':base},ensure_ascii=False))
           except Exception as e:item.update(status='DEFERRED_ERROR',error=repr(e))
           report['cases'].append(item);print('RESULT',item['status'],flush=True)
