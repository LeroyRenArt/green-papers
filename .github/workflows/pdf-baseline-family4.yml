ncept does not translate, that a tool creates more work for a local steward than it releases, or that a different financing form protects the field better. It may also show that a distinction helps people identify a hidden cost or stop a damaging movement.', 'after_text': 'A field is not a laboratory in which people and places become test subjects for an already completed theory.', 'group': 'F4B-ATLAS-02'}, {'site': 'Papers', 'path': 'papers/atlas-of-a-living-architecture.html', 'location': '', 'source_sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'before_html': '<p>Situated knowledge derives strength from proximity to consequence,\nbut proximity does not erase perspective. External knowledge may reveal\nstructures that everyday practice cannot see; it too is shaped by\ninstruments, categories, time horizons, and institutional position.\nResponsible inquiry arises through encounter among partial positions,\nnot through the victory of one scale over another.</p>', 'after_html': '', 'before_text': 'Situated knowledge derives strength from proximity to consequence, but proximity does not erase perspective. External knowledge may reveal structures that everyday practice cannot see; it too is shaped by instruments, categories, time horizons, and institutional position. Responsible inquiry arises through encounter among partial positions, not through the victory of one scale over another.', 'after_text': '[Afsnittet udgår]', 'group': 'F4E-ATLAS-01'}, {'site': 'Papers', 'path': 'papers/atlas-of-a-living-architecture.html', 'location': '', 'source_sha256': 'b1d2568f740fc99900b8481c40ff224dd57e5834c2459fca1d968fb7e4c5267f', 'before_html': '<p>An <strong>AnchorPoint</strong> is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A <strong>field</strong> is the operational\nsurface on which relationship, shared question, action, evidence status,\nand next decision can be described. An AnchorPoint does not\nautomatically activate a field.</p>', 'after_html': '<p>An <strong>AnchorPoint</strong> is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A <strong>field</strong> is the operational\nsurface on which relationship, shared question, action, evidence status,\nand next decision can be described. </p>', 'before_text': 'An AnchorPoint is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A field is the operational surface on which relationship, shared question, action, evidence status, and next decision can be described. An AnchorPoint does not automatically activate a field.', 'after_text': 'An AnchorPoint is a locally rooted shared form through which people, places and regenerative processes may become connected over time through shared stewardship, learning, governance and Return. A rooted relationship may choose to develop such a form; a person or contact is not in itself an AnchorPoint. The form does not automatically activate a field cycle. A field is the operational surface on which relationship, shared question, action, evidence status, and next decision can be described.', 'group': 'F4E-ATLAS-02'}], 'metadata': [{'old': 'v0.1.3', 'new': 'v0.1.4', 'count': 3}, {'old': '11 October 2026', 'new': '12 October 2026', 'count': 2}]}, {'html': 'papers/municipal-work-as-nature.html', 'source_html_sha': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'pdf': 'papers/municipal-work-as-nature.pdf', 'source_pdf_sha': 'ca150bfdb2f29e6e08b2e8e057fceac87ede27e37f8988ac99e18f42c94a3457', 'profile': 'documented-report01', 'golden_css_sha': '1455158e3a90352957f423fac727033f44f59d88e208f59c041aba3b7236c85e', 'candidate_sha': '892455600185854e42837e769541c7ed1039042ae365a82585f3633f34b48d27', 'version': 'Version 1.2.9', 'editorial': [{'site': 'Papers', 'path': 'papers/municipal-work-as-nature.html', 'location': '902', 'source_sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'before_html': '<p>Whether relationship should be understood as an independent dimension or a possible thirteenth layer in the wider 13×13 framework remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the discussion of layers itself to <em>Knowing From the Ground</em> and further methodological development.</p>', 'after_html': '<p>Relationship may be a cross-cutting inquiry function or an independent dimension within a bounded 13×13 form. How it is best included depends on the purpose of the inquiry and remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the specific design to <em>Knowing From the Ground</em> and further methodological development.</p>', 'before_text': 'Whether relationship should be understood as an independent dimension or a possible thirteenth layer in the wider 13×13 framework remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the discussion of layers itself to Knowing From the Ground and further methodological development.', 'after_text': 'Relationship may be a cross-cutting inquiry function or an independent dimension within a bounded 13×13 form. How it is best included depends on the purpose of the inquiry and remains an open methodological question. Report 01 treats relationship as a carrying capacity, but leaves the specific design to Knowing From the Ground and further methodological development.', 'group': 'F4B-WORK-01'}, {'site': 'Papers', 'path': 'papers/municipal-work-as-nature.html', 'location': '', 'source_sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'before_html': '<section id="two-short-workshop-variants" class="level3">\n<h4>Two Short Workshop Variants</h4>\n<p>The full examples above can be supplemented in an early workshop by two simpler miniature calculations.</p>\n<p><strong>Relational continuity</strong></p>\n<p>An AI-assisted search and documentation practice reduces total search, handover, and documentation time by 300 hours a year.</p>\n<p>Implementation, local adaptation, professional control, and maintenance bind 80 hours.</p>\n<blockquote>\n<p>300 hours − 80 hours = 220 hours of possible net G1.</p>\n</blockquote>\n<p>The municipality may decide to reinvest all 220 hours in protected overlap, follow-up on changes in the citizen’s condition, known relationships around particularly sensitive citizens, and learning from errors and deviations.</p>\n<p>The traditional savings account shows no cash gain. The work-ecological account shows 220 hours of capacity moved from administrative friction to relational and professional quality.</p>\n<blockquote>\n<p><strong>Reinvestment is not a loss of the gain. It is the way the gain becomes field care.</strong></p>\n</blockquote>\n<p><strong>High sensitivity</strong></p>\n<p>A bounded pathway can create 70 hours of documented net G1 while also showing faster correction of factual errors, fewer periods without a visible responsibility-holder, better understanding of the next step, and one possibly avoided serious escalation.</p>\n<p>The 70 hours can be documented. The possibly avoided escalation cannot automatically be priced or registered as realised G2. The material can render a connection plausible, but cannot prove what would otherwise have happened.</p>\n<p>The example shows why a highly sensitive field should not be assessed by the same productivity percentage as a high-volume field. A small G1 may be accompanied by great public value through better rights, earlier response, and lower risk of serious harm.</p>\n</section>', 'after_html': '<section id="two-short-workshop-variants" class="level3">\n<h4>Two Short Workshop Variants</h4>\n<p>For an early workshop, examples B and C above can be simplified while retaining net correction, reinvestment in relational quality, and uncertainty about possible G2.</p>\n</section>', 'before_text': 'Two Short Workshop Variants The full examples above can be supplemented in an early workshop by two simpler miniature calculations. Relational continuity An AI-assisted search and documentation practice reduces total search, handover, and documentation time by 300 hours a year. Implementation, local adaptation, professional control, and maintenance bind 80 hours. 300 hours − 80 hours = 220 hours of possible net G1. The municipality may decide to reinvest all 220 hours in protected overlap, follow-up on changes in the citizen’s condition, known relationships around particularly sensitive citizens, and learning from errors and deviations. The traditional savings account shows no cash gain. The work-ecological account shows 220 hours of capacity moved from administrative friction to relational and professional quality. Reinvestment is not a loss of the gain. It is the way the gain becomes field care. High sensitivity A bounded pathway can create 70 hours of documented net G1 while also showing faster correction of factual errors, fewer periods without a visible responsibility-holder, better understanding of the next step, and one possibly avoided serious escalation. The 70 hours can be documented. The possibly avoided escalation cannot automatically be priced or registered as realised G2. The material can render a connection plausible, but cannot prove what would otherwise have happened. The example shows why a highly sensitive field should not be assessed by the same productivity percentage as a high-volume field. A small G1 may be accompanied by great public value through better rights, earlier response, and lower risk of serious harm.', 'after_text': 'Two Short Workshop Variants For an early workshop, examples B and C above can be simplified while retaining net correction, reinvestment in relational quality, and uncertainty about possible G2.', 'group': 'F4E-WORK-01'}, {'site': 'Papers', 'path': 'papers/municipal-work-as-nature.html', 'location': '', 'source_sha256': 'c9d6705ae7b6faa0a3badec7ccf70ce51e0d347faed3dc63ba48cfe59780ed83', 'before_html': '<p>What must be transformed is:</p>\n<ul>\n<li>blind documentation;</li>\n<li>fragmentation;</li>\n<li>hidden displacement of burden;</li>\n<li>control without learning;</li>\n<li>budgetary suboptimisation;</li>\n<li>technology as automatic intensification;</li>\n<li>reforms without a return route.</li>\n</ul>\n<p>What must be carried through the transformation is:</p>\n<ul>\n<li>universal rights;</li>\n<li>solidarity;</li>\n<li>professional practice;</li>\n<li>human dignity;</li>\n<li>democratic legitimacy;</li>\n<li>public accountability;</li>\n<li>institutional memory;</li>\n<li>the right to correction;</li>\n<li>and the individual’s right not to be made transparent.</li>\n</ul>', 'after_html': '<p>Harmful forms must change while rights, solidarity, professional judgement, and democratic responsibility are carried forward. Sections 9.1–9.2 set out what must be transformed and what must be protected.</p>', 'before_text': 'What must be transformed is: blind documentation; fragmentation; hidden displacement of burden; control without learning; budgetary suboptimisation; technology as automatic intensification; reforms without a return route. What must be carried through the transformation is: universal rights; solidarity; professional practice; human dignity; democratic legitimacy; public accountability; institutional memory; the right to correction; and the individual’s right not to be made transparent.', 'after_text': 'Harmful forms must change while rights, solidarity, professional judgement, and democratic responsibility are carried forward. Sections 9.1–9.2 set out what must be transformed and what must be protected.', 'group': 'F4E-WORK-02'}], 'metadata': [{'old': 'Version 1.2.8', 'new': 'Version 1.2.9', 'count': 4}, {'old': '11 October 2026', 'new': '12 October 2026', 'count': 1}]}, {'html': 'papers/atlas-over-en-levende-arkitektur.html', 'source_html_sha': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c', 'pdf': 'papers/atlas-over-en-levende-arkitektur.pdf', 'source_pdf_sha': 'c9e7d6a00635a7e4fc67ee827ee9d67ed6a416991753d8dc6581bdc4ae5fda89', 'profile': 'documented-atlas', 'golden_css_sha': 'ef98ac5304efffa47fcfa7809fb0fdead01bfc5bf1dcfd1e4adece7244f11bb5', 'candidate_sha': '9d483224d3803404865e385cbe4b3f74fc636ff793b70f54c329f265e36bbe5e', 'version': 'v0.1.4', 'editorial': [{'site': 'Papers', 'path': 'papers/atlas-over-en-levende-arkitektur.html', 'location': '', 'source_sha256': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c', 'before_html': '<p>Et <strong>AnchorPoint</strong> er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et <strong>felt</strong> er den operationelle\noverflade, hvor relation, fælles spørgsmål, handling, evidensstatus og\nnæste beslutning kan beskrives. Et AnchorPoint aktiverer ikke automatisk\net felt.</p>', 'after_html': '<p>Et <strong>AnchorPoint</strong> er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et <strong>felt</strong> er den operationelle\noverflade, hvor relation, fælles spørgsmål, handling, evidensstatus og\nnæste beslutning kan beskrives. </p>', 'before_text': 'Et AnchorPoint er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et felt er den operationelle overflade, hvor relation, fælles spørgsmål, handling, evidensstatus og næste beslutning kan beskrives. Et AnchorPoint aktiverer ikke automatisk et felt.', 'after_text': 'Et AnchorPoint er en lokalt forankret fælles form, hvor mennesker, steder og regenerative processer kan forbindes over tid gennem delt stewardship, læring, governance og Return. En eksisterende relation kan vælge at udvikle en sådan form; en person eller kontakt er ikke i sig selv et AnchorPoint. Formen aktiverer ikke automatisk en feltcyklus. Et felt er den operationelle overflade, hvor relation, fælles spørgsmål, handling, evidensstatus og næste beslutning kan beskrives.', 'group': 'F4E-ATLAS-02'}, {'site': 'Papers', 'path': 'papers/atlas-over-en-levende-arkitektur.html', 'location': '', 'source_sha256': '62e39e97608dd3c25aa36eedb70e8ef0c68ef3eb62c20f93652be7734c033f3c', 'before_html': '<p>Generativ AI gør denne situation mere synlig. Den kan sammenfatte,\noversætte, kode, visualisere og organisere materiale i et tempo, som\nændrer forholdet mellem tid, kompetence og produktion.\nProduktivitetsgevinsten er virkelig, selv når kvaliteten fortsat kræver\nmenneskelig læsning og ansvar.</p>', 'after_html': '<p>Generativ AI gør denne situation mere synlig. Den kan sammenfatte,\noversætte, kode, visualisere og organisere materiale i et tempo, som\nændrer forholdet mellem tid, kompetence og produktion.\nDer kan være en reel produktivitetsgevinst, men kvaliteten kræver fortsat menneskelig læsning og ansvar.</p>', 'before_text': 'Generativ AI gør denne situation mere synlig. Den kan sammenfatte, oversætte, kode, visualisere og organisere materiale i et tempo, som ændrer forholdet mellem tid, kompetence og produktion. Produktivitetsgevinsten er virkelig, selv når kvaliteten fortsat kræver menneskelig læsning og ansvar.', 'after_text': 'Generativ AI gør denne situation mere synlig. Den kan sammenfatte, oversætte, kode, visualisere og organisere materiale i et tempo, som ændrer forholdet mellem tid, kompetence og produktion. Der kan være en reel produktivitetsgevinst, men kvaliteten kræver fortsat menneskelig læsning og ansvar.', 'group': 'F4E-AI-01'}], 'metadata': [{'old': 'v0.1.3', 'new': 'v0.1.4', 'count': 3}, {'old': '11. oktober 2026', 'new': '12. oktober 2026', 'count': 2}]}, {'html': 'papers/kommunalt-arbejde-som-natur.html', 'source_html_sha': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'pdf': 'papers/kommunalt-arbejde-som-natur.pdf', 'source_pdf_sha': '5f31c6760eb13becb8a75518ffbc40177b1477ddfd9a6c68cfa28af200c47731', 'profile': 'documented-report01', 'golden_css_sha': '1455158e3a90352957f423fac727033f44f59d88e208f59c041aba3b7236c85e', 'candidate_sha': '99eeb957acd98898c1eac7f79b74d1d9507b383a8ebc30f45320c1c970f815e2', 'version': 'Version 1.2.9', 'editorial': [{'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '902', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': '<p>Om relation bør forstås som en selvstændig dimension eller et muligt trettende lag i den bredere 13×13-ramme, forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader selve lagdiskussionen til <em>Knowing From the Ground</em> og den videre metodeudvikling.</p>', 'after_html': '<p>Relation kan være en tværgående undersøgelsesfunktion eller en selvstændig dimension i en afgrænset 13×13-form. Hvordan den bedst indgår, afhænger af undersøgelsens formål og forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader den konkrete udformning til <em>Knowing From the Ground</em> og den videre metodeudvikling.</p>', 'before_text': 'Om relation bør forstås som en selvstændig dimension eller et muligt trettende lag i den bredere 13×13-ramme, forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader selve lagdiskussionen til Knowing From the Ground og den videre metodeudvikling.', 'after_text': 'Relation kan være en tværgående undersøgelsesfunktion eller en selvstændig dimension i en afgrænset 13×13-form. Hvordan den bedst indgår, afhænger af undersøgelsens formål og forbliver et åbent metodisk spørgsmål. Report 01 behandler relation som bærende kapacitet, men overlader den konkrete udformning til Knowing From the Ground og den videre metodeudvikling.', 'group': 'F4B-WORK-01'}, {'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '1528', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': 'læses som et egenskab ved hele arbejdsfeltet', 'after_html': 'læses som en egenskab ved hele arbejdsfeltet', 'before_text': 'læses som et egenskab ved hele arbejdsfeltet', 'after_text': 'læses som en egenskab ved hele arbejdsfeltet', 'group': 'F4B-WORK-02'}, {'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': '<section class="level3" id="to-korte-workshopvarianter">\n<h4>To korte workshopvarianter</h4>\n<p>De fulde eksempler ovenfor kan i en tidlig workshop suppleres af to enklere miniatureberegninger.</p>\n<p><strong>Relationel kontinuitet</strong></p>\n<p>En AI-understøttet søge- og dokumentationspraksis reducerer samlet søge-, overleverings- og dokumentationstid med 300 timer om året.</p>\n<p>Implementering, lokal tilpasning, faglig kontrol og vedligeholdelse binder 80 timer.</p>\n<blockquote>\n<p>300 timer − 80 timer = 220 timers mulig netto-G1.</p>\n</blockquote>\n<p>Kommunen kan beslutte at reinvestere alle 220 timer i beskyttet overlap, opfølgning på ændringer i borgerens tilstand, kendte relationer omkring særligt følsomme borgere og læring fra fejl og afvigelser.</p>\n<p>Det traditionelle besparelsesregnskab viser ingen kontant gevinst. Det arbejdsøkologiske regnskab viser 220 timers kapacitet, som er flyttet fra administrativ friktion til relationel og faglig kvalitet.</p>\n<blockquote>\n<p><strong>Reinvesteringen er ikke et tab af gevinsten. Den er den måde, gevinsten bliver til feltomsorg.</strong></p>\n</blockquote>\n<p><strong>Høj følsomhed</strong></p>\n<p>Et afgrænset forløb kan skabe 70 timers dokumenteret netto-G1 og samtidig vise hurtigere korrektion af faktuelle fejl, færre perioder uden synlig ansvarsholder, bedre forståelse af næste skridt og én mulig undgået alvorlig eskalation.</p>\n<p>De 70 timer kan dokumenteres. Den mulige undgåede eskalation kan ikke uden videre prissættes eller registreres som realiseret G2. Materialet kan sandsynliggøre en forbindelse, men ikke bevise, hvad der ellers ville være sket.</p>\n<p>Eksemplet viser, hvorfor et højfølsomt felt ikke skal vurderes gennem samme produktivitetsprocent som et højvolumenfelt. En lille G1 kan ledsages af stor offentlig værdi gennem bedre rettigheder, tidligere reaktion og mindre risiko for alvorlig skade.</p>\n</section>', 'after_html': '<section class="level3" id="to-korte-workshopvarianter">\n<h4>To korte workshopvarianter</h4>\n<p>Til en tidlig workshop kan eksemplerne B og C ovenfor forenkles, så nettokorrektion, reinvestering i relationel kvalitet og usikkerheden om mulig G2 stadig fremgår.</p>\n</section>', 'before_text': 'To korte workshopvarianter De fulde eksempler ovenfor kan i en tidlig workshop suppleres af to enklere miniatureberegninger. Relationel kontinuitet En AI-understøttet søge- og dokumentationspraksis reducerer samlet søge-, overleverings- og dokumentationstid med 300 timer om året. Implementering, lokal tilpasning, faglig kontrol og vedligeholdelse binder 80 timer. 300 timer − 80 timer = 220 timers mulig netto-G1. Kommunen kan beslutte at reinvestere alle 220 timer i beskyttet overlap, opfølgning på ændringer i borgerens tilstand, kendte relationer omkring særligt følsomme borgere og læring fra fejl og afvigelser. Det traditionelle besparelsesregnskab viser ingen kontant gevinst. Det arbejdsøkologiske regnskab viser 220 timers kapacitet, som er flyttet fra administrativ friktion til relationel og faglig kvalitet. Reinvesteringen er ikke et tab af gevinsten. Den er den måde, gevinsten bliver til feltomsorg. Høj følsomhed Et afgrænset forløb kan skabe 70 timers dokumenteret netto-G1 og samtidig vise hurtigere korrektion af faktuelle fejl, færre perioder uden synlig ansvarsholder, bedre forståelse af næste skridt og én mulig undgået alvorlig eskalation. De 70 timer kan dokumenteres. Den mulige undgåede eskalation kan ikke uden videre prissættes eller registreres som realiseret G2. Materialet kan sandsynliggøre en forbindelse, men ikke bevise, hvad der ellers ville være sket. Eksemplet viser, hvorfor et højfølsomt felt ikke skal vurderes gennem samme produktivitetsprocent som et højvolumenfelt. En lille G1 kan ledsages af stor offentlig værdi gennem bedre rettigheder, tidligere reaktion og mindre risiko for alvorlig skade.', 'after_text': 'To korte workshopvarianter Til en tidlig workshop kan eksemplerne B og C ovenfor forenkles, så nettokorrektion, reinvestering i relationel kvalitet og usikkerheden om mulig G2 stadig fremgår.', 'group': 'F4E-WORK-01'}, {'site': 'Papers', 'path': 'papers/kommunalt-arbejde-som-natur.html', 'location': '', 'source_sha256': '98520edb6bfcae9ca4da52077f476635313eee3d7b8004e97e226fcf817c20e9', 'before_html': '<p>Det, der må transformeres, er:</p>\n<ul>\n<li>blind dokumentation;</li>\n<li>fragmentering;</li>\n<li>skjult byrdeforskydning;</li>\n<li>kontrol uden læring;</li>\n<li>budgetmæssig suboptimering;</li>\n<li>teknologi som automatisk intensivering;</li>\n<li>reformer uden returvej.</li>\n</ul>\n<p>Det, der skal bæres gennem transformationen, er:</p>\n<ul>\n<li>universelle rettigheder;</li>\n<li>solidaritet;</li>\n<li>faglighed;</li>\n<li>menneskelig værdighed;</li>\n<li>demokratisk legitimitet;</li>\n<li>offentlig ansvarsbæring;</li>\n<li>institutionel hukommelse;</li>\n<li>retten til korrektion;</li>\n<li>og den enkeltes ret til ikke at blive gjort transparent.</li>\n</ul>', 'after_html': '<p>De skadelige former skal forandres, mens rettigheder, solidaritet, faglighed og demokratisk ansvar bæres videre. Afsnit 9.1–9.2 udfolder, hvad der skal transformeres, og hvad der skal beskyttes.</p>', 'before_text': 'Det, der må transformeres, er: blind dokumentation; fragmentering; skjult byrdeforskydning; kontrol uden læring; budgetmæssig suboptimering; teknologi som automatisk intensivering; reformer uden returvej. Det, der skal bæres gennem transformationen, er: universelle rettigheder; solidaritet; faglighed; menneskelig værdighed; demokratisk legitimitet; offentlig ansvarsbæring; institutionel hukommelse; retten til korrektion; og den enkeltes ret til ikke at blive gjort transparent.', 'after_text': 'De skadelige former skal forandres, mens rettigheder, solidaritet, faglighed og demokratisk ansvar bæres videre. Afsnit 9.1–9.2 udfolder, hvad der skal transformeres, og hvad der skal beskyttes.', 'group': 'F4E-WORK-02'}], 'metadata': [{'old': 'Version 1.2.8', 'new': 'Version 1.2.9', 'count': 4}, {'old': '11. oktober 2026', 'new': '12. oktober 2026', 'count': 1}]}, {'html': 'papers/a-decent-economy-under-the-jurisdiction-of-life.html', 'source_html_sha': '220ba7ea88f0f5fbf952c1c113ffa89e73141820b26ee91f6c30f200e33f083e', 'pdf': 'papers/a-decent-economy-under-the-jurisdiction-of-life.pdf', 'source_pdf_sha': '7c50cbf72ac4d604d3740fd05695a9b1c3998d324463e0ac4e075218608aeea7', 'profile': 'synthetic-serif-dejavu-sans', 'golden_css_sha': 'e7bb50b8213995fac038ce636382d15861d8737d37087e1f2cbb78a687e81496', 'candidate_sha': '220d25dc888838ff096091e65ffd0cfac745162494cfefbeca680e51e7bbfda3', 'version': 'v0.2.3', 'editorial': [{'site': 'Papers', 'path': 'papers/a-decent-economy-under-the-jurisdiction-of-life.html', 'location': '', 'source_sha256': '220ba7ea88f0f5fbf952c1c113ffa89e73141820b26ee91f6c30f200e33f083e', 'before_html': '<p>The economic grammar keeps different relationships distinct. The learning architecture makes the hypotheses correctable. The membrane regulates passage between the different logics of capital, institutions, and living fields. Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.</p>', 'after_html': '<p>Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.</p>', 'before_text': 'The economic grammar keeps different relationships distinct. The learning architecture makes the hypotheses correctable. The membrane regulates passage between the different logics of capital, institutions, and living fields. Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.', 'after_text': 'Penguin Economics helps us see the cold edge. Moral Biology and Gold Before Bloom remind us that no abstraction may demand more than living bodies can carry. Elir and Elia protect place-bound commitment and human dignity, respectively, from exchangeability and capture. PG Ledger preserves provenance. Flow Desk helps the next legitimate movement find its form.', 'group': 'F4E-ECON-01'}, {'site': 'Papers', 'path': 'papers/a-decent-economy-under-the-jurisdiction-of-life.html', 'location': '', 'source_sha256': '220ba7ea88f0f5fbf952c1c113ffa89e73141820b26ee91f6c30f200e33f083e', 'before_html': '<p>The productivity gain is real. But its social meaning depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.</p>', 'after_html': '<p>The productivity gain may be real, but depends on the task and conditions. Its social meaning also depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.</p>', 'before_text': 'The productivity gain is real. But its social meaning depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.', 'after_text': 'The productivity gain may be real, but depends on the task and conditions. Its social meaning also depends on ownership and distribution. If AI-freed time primarily becomes higher returns, fewer employees, and more intensive monitoring of those who remain, the technology reinforces the cold edge. If part of the gain is instead converted into shorter working hours, learning, care, art, ecological restoration, and local capacity, it may become part of a different transition.', 'group': 'F4E-AI-01'}], 'metadata': [{'old': 'v0.2.2', 'new': 'v0.2.3', 'count': 3}, {'old': '10 October 2026', 'new': '12 October 2026', 'count': 2}]}, {'html': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'source_html_sha': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'pdf': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.pdf', 'source_pdf_sha': '1c8bd2cb64bd74da9470ac3ab49092392972fa3e0e64288f0cc2b86884af5720', 'profile': 'synthetic-serif-dejavu-sans', 'golden_css_sha': 'e7bb50b8213995fac038ce636382d15861d8737d37087e1f2cbb78a687e81496', 'candidate_sha': 'd4700c7e2961d0109a3765fdbecda929a8e3d41520958a9e66088e234a88e65f', 'version': 'v0.2.3', 'editorial': [{'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': 'Kortere indgange; anchor only', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<a href="https://spiralweb.earth/cafes/sofia/short-reads/a-decent-economy/">Foretrækker du en kortere indgang? Læs den engelske Short Read →</a>', 'after_html': '<a href="https://spiralweb.earth/da/korte-laesninger/en-anstaendig-oekonomi-under-livets-jurisdiktion/">Foretrækker du en kortere indgang? Læs den danske korte læsning →</a>', 'before_text': 'Foretrækker du en kortere indgang? Læs den engelske Short Read →', 'after_text': 'Foretrækker du en kortere indgang? Læs den danske korte læsning →', 'group': 'F4B-ECON-01'}, {'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': '', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<p>Den økonomiske grammatik holder forskellige relationer adskilt. Læringsarkitekturen gør hypoteserne korrigerbare. Membranen regulerer passagen mellem kapitalens, institutionernes og de levende felters forskellige logikker. Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.</p>', 'after_html': '<p>Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.</p>', 'before_text': 'Den økonomiske grammatik holder forskellige relationer adskilt. Læringsarkitekturen gør hypoteserne korrigerbare. Membranen regulerer passagen mellem kapitalens, institutionernes og de levende felters forskellige logikker. Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.', 'after_text': 'Penguin Economics hjælper med at se den kolde kant. Moral Biology og Gold Before Bloom minder om, at ingen abstraktion må kræve mere, end levende kroppe kan bære. Elir og Elia beskytter henholdsvis den stedbundne forpligtelse og den menneskelige værdighed mod omsættelighed og capture. PG Ledger bevarer proveniens. Flow Desk hjælper den næste legitime bevægelse med at finde sin form.', 'group': 'F4E-ECON-01'}, {'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': '', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<p>AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste konsekvente bevægelse—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.</p>', 'after_html': '<p>AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste bevægelse med konsekvenser—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.</p>', 'before_text': 'AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste konsekvente bevægelse—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.', 'after_text': 'AI kan understøtte research, sammenstilling, oversættelse, scenarier, dokumentation og strukturel hukommelse. AI kan ikke fastlægge lokal sandhed, mandat eller legitim ækvivalens. Den sidste bevægelse med konsekvenser—The Last Impulse—tilhører et navngivet menneske eller et legitimt organ med reel adgang, tid, kompetence og myndighed til at ændre beslutningen.', 'group': 'F4E-ECON-02'}, {'site': 'Papers', 'path': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'location': '', 'source_sha256': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'before_html': '<p>Produktivitetsgevinsten er virkelig. Men dens samfundsmæssige betydning afhænger af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af en anden overgang.</p>', 'after_html': '<p>Produktivitetsgevinsten kan være reel, men afhænger af opgaven og betingelserne. Dens samfundsmæssige betydning afhænger også af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af en anden overgang.</p>', 'before_text': 'Produktivitetsgevinsten er virkelig. Men dens samfundsmæssige betydning afhænger af ejerskab og fordeling. Hvis AI-frigjort tid primært bliver til højere afkast, færre ansatte og mere intens overvågning af de tilbageværende, forstærker teknologien den kolde kant. Hvis en del af gevinsten i stedet omsættes til kortere arbejdstid, læring, omsorg, kunst, naturgenopretning og lokal kapacitet, kan den blive en del af 