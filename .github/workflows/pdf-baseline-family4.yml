name: Independent native contact live closeout
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3d0ca75b103ebe350873abe0ef668e0dd41e555
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Read current public resources
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import os,json,subprocess,hashlib,re
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['RUNNER_TEMP'])/'contact-class6';O.mkdir()
          B='b12dcdca188c48913129c5415062aed26bcd88a7';H='a3d0ca75b103ebe350873abe0ef668e0dd41e555';U='https://papers.spiralweb.earth'
          files=['privacy.html','papers/living-landscapes.html','papers/levende-landskaber.html']
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==H
          assert sorted(subprocess.check_output(['git','diff','--name-only',B,H]).decode().splitlines())==sorted(files+['sitemap.xml'])
          for f in files:
           old=subprocess.check_output(['git','show',B+':'+f]);new=Path(f).read_bytes();pat=rb'(<a href="mailto:contact@spiralweb\.earth">.*?</a>)';assert len(re.findall(pat,old,re.S))==1
           assert new==re.sub(pat,rb'<!--email_off-->\1<!--/email_off-->',old,flags=re.S)
          old=subprocess.check_output(['git','show',B+':sitemap.xml']);assert Path('sitemap.xml').read_bytes()==old.replace(b'<loc>https://papers.spiralweb.earth/</loc>\n    <lastmod>2026-10-12</lastmod>',b'<loc>https://papers.spiralweb.earth/</loc>\n    <lastmod>2026-10-13</lastmod>')
          subprocess.run(['node','scripts/build_public.mjs'],check=True);public=json.loads(Path('public-files.json').read_text());assert len(public)==195
          assert all(Path(f).read_bytes()==(Path('dist')/f).read_bytes() for f in public)
          r=dict(status='RUNNING',head=H,base=B,cases=[],files=195,production_writes=0)
          with sync_playwright() as pw:
           browser=pw.chromium.launch();r['browser_version']=browser.version
           for f in files:
            for w in [1280,390,320]:
             for js in [True,False]:
              c=browser.new_context(viewport={'width':w,'height':1000},java_script_enabled=js);p=c.new_page();resp=p.goto(U+'/'+f,wait_until='networkidle');assert resp.status==200
              body=resp.body();source=Path(f).read_bytes();norm=lambda b:b.replace(b'<!--email_off-->',b'').replace(b'<!--/email_off-->',b'')
              assert norm(body)==norm(source);assert p.locator('a[href="mailto:contact@spiralweb.earth"]').count()==1
              assert p.locator('a[href^="/cdn-cgi/l/email-protection"]').count()==0
              assert p.evaluate('document.documentElement.scrollWidth<=innerWidth')
              r['cases'].append(dict(path=f,width=w,javascript=js,status='PASS',exact_html=True,native_mailto=True));c.close()
           browser.close()
          assert subprocess.check_output(['git','ls-remote','origin','refs/heads/main']).decode().split()[0]==H
          sm=subprocess.check_output(['curl','-sS','--compressed','--max-time','30',U+'/sitemap.xml'])
          assert sm==Path('sitemap.xml').read_bytes()
          r['sitemap_exact']=True
          r['status']='PASS';(O/'RESULT.json').write_text(json.dumps(r,indent=2));(O/'MANIFEST.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in O.iterdir() if p.is_file()},indent=2))
          
          PYCODE
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contact-class6
          path: ${{ runner.temp }}/contact-class6
          retention-days: 30
          if-no-files-found: error
