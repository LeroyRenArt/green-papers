name: Sealed Papers backup and restore
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3d0ca75b103ebe350873abe0ef668e0dd41e555
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: python -m pip install pypdf==6.1.1
      - name: Backup and offline restore
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import os,json,subprocess,hashlib,zipfile,tempfile
          from pypdf import PdfReader
          O=Path(os.environ['RUNNER_TEMP'])/'final-backup';O.mkdir()
          H='a3d0ca75b103ebe350873abe0ef668e0dd41e555'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          assert git('rev-parse','HEAD')==H
          assert git('ls-remote','origin','refs/heads/main').split()[0]==H
          subprocess.run(['git','archive','--format=zip','--output='+str(O/'papers-source.zip'),H],check=True)
          subprocess.run(['git','bundle','create',str(O/'papers-history.bundle'),'HEAD'],check=True)
          subprocess.run(['git','bundle','verify',str(O/'papers-history.bundle')],check=True)
          subprocess.run(['node','scripts/build_public.mjs'],check=True)
          public=json.loads(Path('public-files.json').read_text());assert len(public)==195
          assert all(Path(f).read_bytes()==(Path('dist')/f).read_bytes() for f in public)
          with zipfile.ZipFile(O/'papers-public.zip','w',zipfile.ZIP_DEFLATED) as z:
           for f in sorted(public):z.write('dist/'+f,f)
          source={f:sha(Path(f).read_bytes()) for f in git('ls-tree','-r','--name-only',H).splitlines()}
          manifest={f:sha(Path('dist',f).read_bytes()) for f in public}
          with tempfile.TemporaryDirectory() as t:
           p=Path(t)
           for name,expected in [('papers-source.zip',source),('papers-public.zip',manifest)]:
            d=p/name;d.mkdir()
            with zipfile.ZipFile(O/name) as z:assert z.testzip() is None;z.extractall(d)
            actual={str(f.relative_to(d)):sha(f.read_bytes()) for f in d.rglob('*') if f.is_file()}
            assert actual==expected
           clone=p/'restored-git';subprocess.run(['git','clone',str(O/'papers-history.bundle'),str(clone)],check=True)
           assert subprocess.check_output(['git','-C',str(clone),'rev-parse','HEAD']).decode().strip()==H
           assert subprocess.check_output(['git','-C',str(clone),'rev-parse','HEAD^{tree}']).decode().strip()=='65c1860f1023ca62ade8d9b9e66f15836ba1a1ee'
          profiles=[]
          for f in public:
           if f.endswith('.pdf'):
            r=PdfReader(f);root=r.trailer['/Root'];profiles.append(dict(path=f,sha256=manifest[f],pages=len(r.pages),tagged='/StructTreeRoot' in root,lang=str(root.get('/Lang','')),producer=str((r.metadata or {}).get('/Producer',''))))
          assert git('ls-remote','origin','refs/heads/main').split()[0]==H
          (O/'RESULT.json').write_text(json.dumps(dict(result='PASS',head=H,source_files=len(source),public_files=len(public),source_manifest=source,public_manifest=manifest,pdf_profiles=profiles,zip_restore_exact=True,git_bundle_clone_exact=True,production_writes=0),indent=2))
          (O/'MANIFEST.json').write_text(json.dumps({p.name:sha(p.read_bytes()) for p in O.iterdir() if p.is_file()},indent=2))
          print('PASS backup restore',len(source),195)
          
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-backup
          path: ${{ runner.temp }}/final-backup
          retention-days: 30
          if-no-files-found: error
