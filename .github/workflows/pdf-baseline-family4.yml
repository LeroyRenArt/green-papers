          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['GITHUB_WORKSPACE'])/'source';out=Path(os.environ['RUNNER_TEMP'])/'papers-browser-proof';sha=lambda b:hashlib.sha256(b).hexdigest();manifest=json.loads((out/'source-manifest.json').read_text());assert all((root/n).is_file() and sha((root/n).read_bytes())==h for n,h in manifest.items())
          stage=out/'stage';staged=json.loads((out/'stage-manifest.json').read_text());assert all((stage/n).is_file() and sha((stage/n).read_bytes())==h for n,h in staged.items());r=json.loads((out/'RESULT.json').read_text());r['source_and_candidate_files_unchanged']=True;(out/'RESULT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2))
          (out/'MANIFEST.json').write_text(json.dumps({p.relative_to(out).as_posix():sha(p.read_bytes()) for p in out.rglob('*') if p.is_file() and 'stage' not in p.relative_to(out).parts},indent=2))
          PY
