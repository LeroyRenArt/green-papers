          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          import base64,difflib,hashlib,json,logging,os,re,shutil,subprocess,unicodedata
          import fitz,weasyprint
          from weasyprint import HTML,CSS
          from weasyprint.urls import URLFetcher
          from weasyprint.text.fonts import FontConfiguration
          from PIL import Image,ImageDraw
          from html.parser import HTMLParser
          from collections import Counter
          ROOT=Path.cwd().resolve();OUT=Path(os.environ['RUNNER_TEMP'])/'pdf-baseline-proof';OUT.mkdir()
          EXPECTED_MAIN='23d1e46e619f843e0f74dd318ef50e4e96ad7f79'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==EXPECTED_MAIN
          assert weasyprint.__version__=='70.0'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          inputs={str(p.relative_to(ROOT)):sha(p.read_bytes()) for p in ROOT.rglob('*') if p.is_file() and '.git' not in p.parts}
          class LocalFetcher(URLFetcher):
           def __init__(self):super().__init__(allowed_protocols=['file','data'],fail_on_errors=True);self.resources=[]
           def fetch(self,url,headers=None):
            u=urlsplit(url)
            if u.scheme=='data':return super().fetch(url,headers)
            if u.scheme in ('https','http') and u.hostname in ('papers.spiralweb.earth','green-papers.pages.dev'):
             p=(ROOT/unquote(u.path).lstrip('/')).resolve()
            elif u.scheme=='file':p=Path(unquote(u.path)).resolve()
            else:raise ValueError('Unapproved external print resource: '+url)
            if ROOT not in p.parents or not p.is_file():raise ValueError('Missing or external local print resource: '+str(p))
            self.resources.append(dict(path=str(p.relative_to(ROOT)),sha256=sha(p.read_bytes())))
            return super().fetch(p.as_uri(),headers)
          class LogCapture(logging.Handler):
           def __init__(self):super().__init__();self.messages=[]
           def emit(self,record):self.messages.append(dict(level=record.levelname,message=record.getMessage()))
          log=LogCapture();logging.getLogger('weasyprint').addHandler(log)
          def norm(t):
           t=unicodedata.normalize('NFKC',t).replace('\u00ad','').replace('\u200b','')
           return re.sub(r'\s+',' ',t).strip()
          def inspect(path,label,folder):
           with fitz.open(path) as doc:
            texts=[p.get_text() for p in doc];pixels=[];outside=[];thumbs=[];fonts=[]
            for i,page in enumerate(doc):
             pix=page.get_pixmap(alpha=False);pixels.append(sha(pix.samples));fonts.extend(page.get_fonts())
             for word in page.get_text('words'):
              if word[0]<-.5 or word[1]<-.5 or word[2]>page.rect.width+.5 or word[3]>page.rect.height+.5:outside.append(dict(page=i+1,text=word[4],bounds=list(word[:4])))
             im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
             im.thumbnail((180,255));thumbs.append(im)
             if i in (0,len(doc)//2,len(doc)-1):pix.save(folder/(label+'-page-'+str(i+1)+'.png'))
            for start in range(0,len(thumbs),20):
             subset=thumbs[start:start+20];sheet=Image.new('RGB',(1000,((len(subset)+4)//5)*295),'#dfe4e8');draw=ImageDraw.Draw(sheet)
             for n,im in enumerate(subset):x=(n%5)*200+10;y=(n//5)*295+24;sheet.paste(im,(x,y));draw.text((x,y-18),str(start+n+1),fill='#172b39')
             sheet.save(folder/(label+'-contact-'+str(start+1)+'.png'))
            (folder/(label+'-text.txt')).write_text('\n\f\n'.join(texts))
            return dict(pages=len(doc),page_texts=texts,page_pixels=pixels,page_sizes=[list(p.rect) for p in doc],outside_page=outside,fonts=sorted(set(str(x) for x in fonts)),metadata=doc.metadata)
          
          def alias_css(html,sans):
           # Extract only explicit family declarations from the document's inline CSS.
           # The override lives in diagnostic print CSS, never in repository HTML.
           rules=[]
           for sheet in re.findall(r'<style[^>]*>(.*?)</style>',html.read_text(),re.S):
            for selector,decl in re.findall(r'([^{}]+)\{([^{}]*)\}',sheet):
             if ('font-family:' in decl or re.search(r'\bfont\s*:',decl)) and any(n in decl for n in ('Arial','Helvetica','Jost')):
              selector=selector.strip()
              if selector.startswith('@'):continue
              rules.append(selector+'{font-family:'+sans+'!important}')
           return ''.join(rules)
          
