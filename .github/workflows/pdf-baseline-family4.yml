name: Spiralweb Family5 journeys reflow and network
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 791ad03339fbf0bb1c555723f158ce67d6175dfa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check six live journeys, reflow, image loading and noJS email
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlparse
          import os,json,hashlib,re,subprocess,traceback
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['RUNNER_TEMP'])/'family5-journeys';OUT.mkdir();HEAD='791ad03339fbf0bb1c555723f158ce67d6175dfa';P='https://papers.spiralweb.earth';M='https://spiralweb.earth'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          result={'status':'RUNNING','timestamp_utc':datetime.now(timezone.utc).isoformat(),'papers_source':HEAD,'journeys':[],'layout':[],'slow_network':[],'no_js_email':[],'findings':[],'production_writes':0}
          def main_ref(label):
           r=subprocess.run(['git','ls-remote','origin','refs/heads/main'],capture_output=True,text=True,timeout=60);(OUT/(label+'.txt')).write_text(r.stdout);assert r.returncode==0 and r.stdout.split()[0]==HEAD
          def state(page):
           return page.evaluate('''()=>({title:document.title,h1:document.querySelector('h1')?.textContent.trim(),width:innerWidth,overflow:document.documentElement.scrollWidth-innerWidth,lang:document.documentElement.lang,images:[...document.images].map(i=>({alt:i.alt,src:i.currentSrc,width:i.getBoundingClientRect().width,height:i.getBoundingClientRect().height,complete:i.complete,naturalWidth:i.naturalWidth,loading:i.loading}))})''')
          def document_status(page,records):
           matches=[r for r in records if r['url']==page.url and r['type']=='document'];return matches[-1]['status'] if matches else None
          def attach(page):
           records=[];page.on('response',lambda r:records.append({'url':r.url,'status':r.status,'type':r.request.resource_type}));return records
          def follow(page,pattern,records):
           links=page.locator('a[href]').evaluate_all("es=>es.map(a=>({raw:a.getAttribute('href'),url:a.href,text:a.textContent.trim()}))")
           options=[a for a in links if re.search(pattern,a['url'])];assert options,{'missing_link_pattern':pattern,'page':page.url,'links':links}
           a=options[0];page.locator('a[href='+json.dumps(a['raw'])+']').first.click();page.wait_for_load_state('networkidle')
           assert document_status(page,records)==200,(page.url,records[-8:]);s=state(page);assert s['h1'] and page.locator('h1').first.is_visible()
           return {'link':a, 'url':page.url,**s}
          try:
           main_ref('main-before')
           with sync_playwright() as pw:
            browser=pw.chromium.launch();result['browser_version']=browser.version
            paths=[('new_reader',[r'/cafes/sofia/short-reads/$',r'/short-reads/.+']),('local_practice',[r'spiralweb\.earth/pg-ledger/$',r'spiralweb\.earth/formats/$',r'/formats/format1-dashboard']),('research',[r'/papers/atlas-of-a-living-architecture$',r'/papers/atlas-over-en-levende-arkitektur$',r'/library(?:#|$)']),('support',[r'spiralweb\.earth/association/$',r'spiralweb\.earth/support/$',r'spiralweb\.earth/shared-capacity/$']),('danish',[r'/da/laeseorientering$',r'spiralweb\.earth/da/$',r'/da/korte-laesninger/$']),('ai_correction',[r'/toolbox/ai-in-right-relationship/$',r'/ai-human-responsibility$',r'/methods-editorial-practice$'])]
            for name,steps in paths:
             c=browser.new_context(viewport={'width':390,'height':1000});page=c.new_page();records=attach(page);case={'name':name,'steps':[]}
             try:
              assert page.goto(P+'/',wait_until='networkidle').status==200
              for pattern in steps:case['steps'].append(follow(page,pattern,records))
              case['status']='PASS'
             except Exception as e:case['status']='FINDING';case['error']=str(e);result['findings'].append({'kind':'journey','name':name,'error':str(e)})
             result['journeys'].append(case);(OUT/(name+'-responses.json')).write_text(json.dumps(records));c.close()
            pages=[('papers',P+'/'),('library',P+'/library'),('ai_tools',P+'/toolbox/ai-in-right-relationship/'),('da_orientation',P+'/da/laeseorientering'),('association',M+'/association/'),('support',M+'/support/'),('ledger',M+'/pg-ledger/'),('da_foyer',M+'/da/'),('short_reads',M+'/cafes/sofia/short-reads/')]
            for width in [1280,640,390,320]:
             c=browser.new_context(viewport={'width':width,'height':1000});page=c.new_page()
             for name,url in pages:
              case={'page':name,'url':url,'width':width}
              try:
               response=page.goto(url,wait_until='networkidle');assert response.status==200,(url,response.status);s=state(page);case.update(s);assert s['h1']
               if s['overflow']>1:result['findings'].append({'kind':'horizontal_overflow','page':name,'width':width,'pixels':s['overflow']})
               page.keyboard.press('Tab');first=page.evaluate("()=>({text:document.activeElement.textContent.trim(),href:document.activeElement.getAttribute('href')})");case['first_tab']=first
               if first['href'] and first['href'].startswith('#'):
                page.keyboard.press('Enter');case['skip_target']=page.evaluate('document.activeElement.id');case['skip_expected']=first['href'][1:]
                if case['skip_target']!=case['skip_expected']:result['findings'].append({'kind':'skip_focus','page':name,'width':width,'observed':case['skip_target'],'expected':case['skip_expected']})
               else:result['findings'].append({'kind':'first_tab_not_skip','page':name,'width':width,'observed':first})
               tabs=[]
               for i in range(16):
                page.keyboard.press('Tab');tabs.append(page.evaluate("()=>{let e=document.activeElement,s=getComputedStyle(e),r=e.getBoundingClientRect();return {tag:e.tagName,text:e.textContent.trim().slice(0,80),href:e.getAttribute('href'),outline:s.outlineStyle,outlineWidth:s.outlineWidth,top:r.top,bottom:r.bottom}}"))
               case['first_16_tab_controls']=tabs
               if width in [1280,320] and name in ['papers','association','support','da_foyer']:
                page.goto(url,wait_until='networkidle');page.screenshot(path=str(OUT/f'layout-{name}-{width}.png'))
               case['status']='MEASURED'
              except Exception as e:case['status']='FINDING';case['error']=str(e);result['findings'].append({'kind':'layout_probe','page':name,'width':width,'error':str(e)})
              result['layout'].append(case)
             c.close()
            for dpr in [1,2]:
             c=browser.new_context(viewport={'width':390,'height':1000},device_scale_factor=dpr);page=c.new_page();cdp=c.new_cdp_session(page);cdp.send('Network.enable');cdp.send('Network.emulateNetworkConditions',{'offline':False,'latency':150,'downloadThroughput':50000,'uploadThroughput':50000,'connectionType':'cellular3g'})
             response=page.goto(M+'/association/',wait_until='domcontentloaded',timeout=90000);assert response.status==200
             start_state=state(page);assert page.locator('h1').is_visible()
             board=page.locator('#board');board.scroll_into_view_if_needed()
             images=board.locator('img');count=images.count()
             for i in range(count):images.nth(i).scroll_into_view_if_needed();images.nth(i).evaluate("i=>i.decode()")
             case={'dpr':dpr,'latency_ms':150,'download_bytes_per_second':50000,'start_state':start_state,'board_images':images.evaluate_all("es=>es.map(i=>({alt:i.alt,currentSrc:i.currentSrc,srcset:i.getAttribute('srcset'),sizes:i.getAttribute('sizes'),naturalWidth:i.naturalWidth,renderWidth:i.getBoundingClientRect().width,renderHeight:i.getBoundingClientRect().height,complete:i.complete}))"),'timings':page.evaluate("performance.getEntriesByType('resource').map(e=>({name:e.name,duration:e.duration,transferSize:e.transferSize,encodedBodySize:e.encodedBodySize}))")}
             assert count==5 and all(i['complete'] and i['naturalWidth']>0 for i in case['board_images'])
             result['slow_network'].append(case);c.close()
            for name,url in [('papers',P+'/'),('association',M+'/association/'),('support',M+'/support/'),('da_foyer',M+'/da/')]:
             c=browser.new_context(java_script_enabled=False,viewport={'width':390,'height':1000});page=c.new_page();assert page.goto(url,wait_until='networkidle').status==200
             links=page.locator('a[href^="mailto:"]').evaluate_all("es=>es.map(e=>({href:e.href,text:e.textContent.trim()}))");case={'page':name,'mailto_links':links};result['no_js_email'].append(case)
             if not any('contact@spiralweb.earth' in a['href'] for a in links):result['findings'].append({'kind':'no_js_email','page':name})
             c.close()
            browser.close()
           main_ref('main-after');result['status']='COMPLETE_WITH_FINDINGS' if result['findings'] else 'PASS_BOUNDED_JOURNEYS_REFLOW_NETWORK';result['run_id']=os.environ['GITHUB_RUN_ID'];result['control_commit']=os.environ['GITHUB_SHA']
          except Exception as e:result['status']='STOP';result['error']=str(e);(OUT/'traceback.txt').write_text(traceback.format_exc());raise
          finally:
           (OUT/'RESULT.json').write_text(json.dumps(result,indent=2));(OUT/'MANIFEST.json').write_text(json.dumps({p.name:sha(p.read_bytes()) for p in OUT.iterdir() if p.is_file()},indent=2))
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family5-journeys
          path: ${{ runner.temp }}/family5-journeys
          retention-days: 30
          if-no-files-found: error
