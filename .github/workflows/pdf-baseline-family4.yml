name: Family5 complete keyboard sequence and focus measurement
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8035e789ebff9327c891408f7fdceb43cca49dde
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check exact source, text-line bounds, contact and navigation
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,json,hashlib,subprocess,traceback
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['RUNNER_TEMP'])/'family5-keyboard';O.mkdir();H='8035e789ebff9327c891408f7fdceb43cca49dde';P='https://papers.spiralweb.earth';M='https://spiralweb.earth'
          result={'status':'RUNNING','timestamp_utc':datetime.now(timezone.utc).isoformat(),'papers_main':H,'cases':[],'findings':[],'production_writes':0}
          def ref(label):
           r=subprocess.run(['git','ls-remote','origin','refs/heads/main'],capture_output=True,text=True,timeout=60);(O/(label+'.txt')).write_text(r.stdout);assert r.returncode==0 and r.stdout.split()[0]==H
          setup='''()=>{let es=[...document.querySelectorAll('a[href],button,input:not([type="hidden"]),select,textarea,summary,[tabindex]')].filter(e=>e.tabIndex>=0&&!e.disabled&&e.getClientRects().length&&getComputedStyle(e).visibility==='visible'&&!e.closest('[inert]'));es.sort((a,b)=>{let x=a.tabIndex,y=b.tabIndex;return (x>0&&y>0)?x-y:x>0?-1:y>0?1:0});window.__auditFocus=es;return es.map((e,i)=>({i,tag:e.tagName,id:e.id,text:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||e.value||'').trim().slice(0,150),href:e.getAttribute('href'),tabIndex:e.tabIndex}))}'''
          probe='''()=>{let e=document.activeElement,i=window.__auditFocus.indexOf(e),r=e.getBoundingClientRect(),s=getComputedStyle(e);let x=Math.max(0,Math.min(innerWidth-1,(r.left+r.right)/2)),y=Math.max(0,Math.min(innerHeight-1,(r.top+r.bottom)/2)),hit=document.elementFromPoint(x,y);return {i,tag:e.tagName,id:e.id,text:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||e.value||'').trim().slice(0,150),rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height},outline:s.outline,outlineOffset:s.outlineOffset,boxShadow:s.boxShadow,border:s.border,background:s.backgroundColor,focusVisible:e.matches(':focus-visible'),centerHit:hit===e||e.contains(hit),inMain:!!e.closest('main')}}'''
          try:
           ref('main-before')
           with sync_playwright() as pw:
            b=pw.chromium.launch();result['browser_version']=b.version
            pages=[('papers',P+'/'),('library',P+'/library'),('ai_tools',P+'/toolbox/ai-in-right-relationship/'),('da_orientation',P+'/da/laeseorientering'),('association',M+'/association/'),('support',M+'/support/'),('ledger',M+'/pg-ledger/'),('da_foyer',M+'/da/'),('short_reads',M+'/cafes/sofia/short-reads/')]
            for js in [True,False]:
             for w in [1280,390]:
              for name,url in pages:
               c=b.new_context(viewport={'width':w,'height':1000},java_script_enabled=js);p=c.new_page();case={'page':name,'url':url,'width':w,'javascript':js,'forward':[],'reverse':[],'flags':[]}
               try:
                response=p.goto(url,wait_until='networkidle');assert response.status==200;assert p.locator('h1').first.is_visible();case['final_url']=p.url;case['body_sha256']=hashlib.sha256(response.body()).hexdigest();(O/f'{name}-{w}-{js}.html').write_bytes(response.body())
                if js:p.evaluate('()=>document.fonts.ready')
                expected=p.evaluate(setup);case['expected']=expected;assert expected
                for i in range(len(expected)):
                 p.keyboard.press('Tab');state=p.evaluate(probe);case['forward'].append(state)
                 if state['i']!=i:case['flags'].append({'kind':'sequence','direction':'forward','step':i,'actual':state['i']});break
                 if not state['focusVisible']:case['flags'].append({'kind':'no_focus_visible','step':i})
                 if not state['centerHit']:case['flags'].append({'kind':'center_obscured','step':i,'control':expected[i]})
                 if state['outline'].startswith('rgb(0, 0, 0) none') or ' none ' in state['outline']:case['flags'].append({'kind':'outline_none_review','step':i,'control':expected[i],'state':state})
                for i in range(len(expected)-2,-1,-1):
                 p.keyboard.press('Shift+Tab');state=p.evaluate(probe);case['reverse'].append(state)
                 if state['i']!=i:case['flags'].append({'kind':'sequence','direction':'reverse','step':i,'actual':state['i']});break
                p.goto(url,wait_until='networkidle');p.keyboard.press('Tab');first=p.evaluate('()=>document.activeElement.getAttribute("href")');assert first and first.startswith('#');p.keyboard.press('Enter');p.keyboard.press('Tab');assert p.evaluate('()=>!!document.activeElement.closest("main")');case['skip_bypass']=True
                case['status']='MEASURED_WITH_REVIEW_FLAGS' if case['flags'] else 'PASS_SEQUENCE_FOCUS'
               except Exception as e:case['status']='PROBE_STOP';case['error']=str(e);result['findings'].append({'page':name,'width':w,'javascript':js,'error':str(e)})
               result['cases'].append(case);c.close()
            b.close()
           ref('main-after');result['status']='MEASURED_REQUIRES_REVIEW';result['run_id']=os.environ['GITHUB_RUN_ID'];result['control_commit']=os.environ['GITHUB_SHA']
          except Exception as e:result.update({'status':'STOP','error':str(e),'traceback':traceback.format_exc()});raise
          finally:
           (O/'RESULT.json').write_text(json.dumps(result,indent=2));(O/'MANIFEST.json').write_text(json.dumps({x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in O.iterdir() if x.is_file()},indent=2))
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family5-keyboard
          path: ${{ runner.temp }}/family5-keyboard
          retention-days: 30
          if-no-files-found: error
