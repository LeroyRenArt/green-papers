name: Papers nine targeted font and print-profile diagnostics
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  baseline-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 23d1e46e619f843e0f74dd318ef50e4e96ad7f79
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded dependency versions
        run: |
          sudo apt-get update
          sudo apt-get install -y 'libpango-1.0-0=1.52.1+ds-1build1' 'libpangoft2-1.0-0=1.52.1+ds-1build1' 'fonts-dejavu-core=2.37-8' 'fonts-urw-base35=20200910-8'
          cat > "$RUNNER_TEMP/pdf-requirements.lock" <<'LOCK'
          brotli==1.2.0
          cffi==2.1.1
          cssselect2==0.10.1
          fonttools==4.66.1
          pillow==12.3.0
          pycparser==3.11
          pydyf==0.12.1
          PyMuPDF==1.26.6
          pyphen==0.18.1
          tinycss2==1.5.1
          tinyhtml5==2.1.0
          weasyprint==70.0
          webencodings==0.6.1
          zopfli==0.4.3
          LOCK
          python -m pip install -r "$RUNNER_TEMP/pdf-requirements.lock"
      - name: Compare unchanged print profiles
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          import base64,difflib,hashlib,json,logging,os,re,shutil,subprocess,unicodedata
          import fitz,weasyprint
          from weasyprint import HTML,CSS
          from weasyprint.urls import URLFetcher
          from weasyprint.text.fonts import FontConfiguration
          from PIL import Image,ImageDraw
          from html.parser import HTMLParser
          from collections import Counter
          ROOT=Path.cwd().resolve();OUT=Path(os.environ['RUNNER_TEMP'])/'pdf-baseline-proof';OUT.mkdir()
          EXPECTED_MAIN='23d1e46e619f843e0f74dd318ef50e4e96ad7f79'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==EXPECTED_MAIN
          assert weasyprint.__version__=='70.0'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          inputs={str(p.relative_to(ROOT)):sha(p.read_bytes()) for p in ROOT.rglob('*') if p.is_file() and '.git' not in p.parts}
          class LocalFetcher(URLFetcher):
           def __init__(self):super().__init__(allowed_protocols=['file','data'],fail_on_errors=True);self.resources=[]
           def fetch(self,url,headers=None):
            u=urlsplit(url)
            if u.scheme=='data':return super().fetch(url,headers)
            if u.scheme in ('https','http') and u.hostname in ('papers.spiralweb.earth','green-papers.pages.dev'):
             p=(ROOT/unquote(u.path).lstrip('/')).resolve()
            elif u.scheme=='file':p=Path(unquote(u.path)).resolve()
            else:raise ValueError('Unapproved external print resource: '+url)
            if ROOT not in p.parents or not p.is_file():raise ValueError('Missing or external local print resource: '+str(p))
            self.resources.append(dict(path=str(p.relative_to(ROOT)),sha256=sha(p.read_bytes())))
            return super().fetch(p.as_uri(),headers)
          class LogCapture(logging.Handler):
           def __init__(self):super().__init__();self.messages=[]
           def emit(self,record):self.messages.append(dict(level=record.levelname,message=record.getMessage()))
          log=LogCapture();logging.getLogger('weasyprint').addHandler(log)
          def norm(t):
           t=unicodedata.normalize('NFKC',t).replace('\u00ad','').replace('\u200b','')
           return re.sub(r'\s+',' ',t).strip()
          def inspect(path,label,folder):
           with fitz.open(path) as doc:
            texts=[p.get_text() for p in doc];pixels=[];outside=[];thumbs=[];fonts=[]
            for i,page in enumerate(doc):
             pix=page.get_pixmap(alpha=False);pixels.append(sha(pix.samples));fonts.extend(page.get_fonts())
             for word in page.get_text('words'):
              if word[0]<-.5 or word[1]<-.5 or word[2]>page.rect.width+.5 or word[3]>page.rect.height+.5:outside.append(dict(page=i+1,text=word[4],bounds=list(word[:4])))
             im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
             im.thumbnail((180,255));thumbs.append(im)
             if i in (0,len(doc)//2,len(doc)-1):pix.save(folder/(label+'-page-'+str(i+1)+'.png'))
            for start in range(0,len(thumbs),20):
             subset=thumbs[start:start+20];sheet=Image.new('RGB',(1000,((len(subset)+4)//5)*295),'#dfe4e8');draw=ImageDraw.Draw(sheet)
             for n,im in enumerate(subset):x=(n%5)*200+10;y=(n//5)*295+24;sheet.paste(im,(x,y));draw.text((x,y-18),str(start+n+1),fill='#172b39')
             sheet.save(folder/(label+'-contact-'+str(start+1)+'.png'))
            (folder/(label+'-text.txt')).write_text('\n\f\n'.join(texts))
            return dict(pages=len(doc),page_texts=texts,page_pixels=pixels,page_sizes=[list(p.rect) for p in doc],outside_page=outside,fonts=sorted(set(str(x) for x in fonts)),metadata=doc.metadata)
          
          PAIRS=[{'html': 'papers/a-decent-economy-under-the-jurisdiction-of-life.html', 'html_sha': '220ba7ea88f0f5fbf952c1c113ffa89e73141820b26ee91f6c30f200e33f083e', 'pdf': 'papers/a-decent-economy-under-the-jurisdiction-of-life.pdf', 'pdf_sha': '7c50cbf72ac4d604d3740fd05695a9b1c3998d324463e0ac4e075218608aeea7'}, {'html': 'papers/rule-of-life-da.html', 'html_sha': '17eb0472c7008cb2ed502aad91d6c764968348d30ba79f1d59b2c88fae1894a1', 'pdf': 'papers/rule-of-life-da.pdf', 'pdf_sha': '91f21532254f492ce03ccd2c7f31a7ecb8e69215fd04ee146914944e84ebaa36'}, {'html': 'papers/rule-of-life.html', 'html_sha': 'e8ce0a93560fac642b0d443c89624bff319a8dadb364f9ecb0addc95316f4d7b', 'pdf': 'papers/rule-of-life.pdf', 'pdf_sha': '09269af330133a98ecc132c27058951ac9da3e2c9575ded791eb831c18c493b0'}, {'html': 'papers/the-regenerative-municipality.html', 'html_sha': '0a4ca6b370f9c26702ae2caa42939206bc6a0f18c1b6fb879aed871ebfbad0b7', 'pdf': 'papers/the-regenerative-municipality.pdf', 'pdf_sha': '9b704315aa94de8c00903bcb06a8f0edfe96777bab5c62131e4855357622aec6'}, {'html': 'papers/den-nye-faelled.html', 'html_sha': '4810d1cfccbd803bde7accc788fe2a5bdca7c9fe2bdf74f8c8b08ddd4431cf54', 'pdf': 'pdf/den-nye-faelled.pdf', 'pdf_sha': 'd8b0a08aab6ae6432289ea6417a0be5c50c392cdfaf59af1bb3ab29856b8178e'}, {'html': 'papers/den-nye-faelled-en.html', 'html_sha': '4c5b4b06d485e2bd41a173496f0c3bc3323e7272e9cb904f2fa9f241c7970898', 'pdf': 'pdf/den-nye-faelled-en.pdf', 'pdf_sha': 'd09f8175026a04f8d7019e66a9e2351bcc66537a9c2ca88070f06e754c3781b7'}, {'html': 'papers/den-regenerative-kommune.html', 'html_sha': '763dd62439ca26e2ff1d37b6744fb4912db88cf99aa0fe01d63d0e46ca02d9a7', 'pdf': 'papers/den-regenerative-kommune.pdf', 'pdf_sha': 'bf01a0d5984ff2223614c9f53e95c015803dda7671c5d5d92c8f735bea50f61e'}, {'html': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.html', 'html_sha': 'e7ae20b4cc48464a2438656083463328b049e794c6489c6f1ad27a799f8ff43f', 'pdf': 'papers/en-anstaendig-oekonomi-under-livets-jurisdiktion.pdf', 'pdf_sha': '1c8bd2cb64bd74da9470ac3ab49092392972fa3e0e64288f0cc2b86884af5720'}, {'html': 'papers/eve-adam-and-the-penguins-da.html', 'html_sha': 'e6932e6c141b1501d383191deec868c5d733d204a59928c6b804557069715302', 'pdf': 'papers/eve-adam-and-the-penguins-da.pdf', 'pdf_sha': '432829ecf43abbed921f46c2bfe246afbbaf9582614de316129bc48d1b212455'}]
          
          def alias_css(html,sans):
           # Extract only explicit family declarations from the document's inline CSS.
           # The override lives in diagnostic print CSS, never in repository HTML.
           rules=[]
           for sheet in re.findall(r'<style[^>]*>(.*?)</style>',html.read_text(),re.S):
            for selector,decl in re.findall(r'([^{}]+)\{([^{}]*)\}',sheet):
             if 'font-family:' in decl and any(n in decl for n in ('Arial','Helvetica','Jost')):
              selector=selector.strip()
              if selector.startswith('@'):continue
              rules.append(selector+'{font-family:'+sans+'!important}')
           return ''.join(rules)
          report=dict(result='RUNNING',operation_class='Class7 bounded print-profile attribution after baseline differences',source_main=EXPECTED_MAIN,engine=weasyprint.__version__,repository_writes=0,production_writes=0,deployment_attempts=0,candidate_generation=False,production_ready=False,visual_review='PENDING',cases=[])
          try:
           css='a.sw-access-skip{display:none!important}'
           for weight,filename in [(400,'DejaVuSerif.ttf'),(700,'DejaVuSerif-Bold.ttf')]:
            fp=Path('/usr/share/fonts/truetype/dejavu')/filename;raw=fp.read_bytes()
            for style in ('normal',):
             css+='@font-face{font-family:HistoricalSerif;src:url(data:font/ttf;base64,'+base64.b64encode(raw).decode()+');font-weight:'+str(weight)+';font-style:'+style+'}'
           for pair in PAIRS:
            html=ROOT/pair['html'];pdf=ROOT/pair['pdf'];assert sha(html.read_bytes())==pair['html_sha'] and sha(pdf.read_bytes())==pair['pdf_sha']
            folder=OUT/(html.stem);folder.mkdir();shutil.copyfile(pdf,folder/'baseline.pdf');baseline=inspect(pdf,'baseline',folder)
            profiles={}
            serif=css+' body{font-family:HistoricalSerif!important}'
            if html.stem in ('rule-of-life','rule-of-life-da','eve-adam-and-the-penguins-da'):
             selectors='.crumb,.series,.meta,.small,.revision,th,footer' if 'rule-of-life' in html.stem else '.crumb,.series,.meta,.small,.revision,th,footer,.preview-banner,nav,h1,h2,h3,h4,table'
             profiles['synthetic-serif-nimbus']=serif+selectors+'{font-family:Nimbus Sans!important}'
             profiles['synthetic-serif-sans-by-declaration']=serif+alias_css(html,'Nimbus Sans')
            elif html.stem in ('a-decent-economy-under-the-jurisdiction-of-life','en-anstaendig-oekonomi-under-livets-jurisdiktion'):
             profiles['synthetic-serif-dejavu-sans']=serif+alias_css(html,'DejaVu Sans')
            elif html.stem=='den-regenerative-kommune':
             profiles['synthetic-serif-dejavu-sans']=serif+alias_css(html,'DejaVu Sans')
             profiles['synthetic-serif-native-headings']=serif
            else:
             jost='.site-header,.series-label,.hero .kicker,.meta-block,.section-number,.site-footer,.cite-block,.abstract-label,.editorial-note .note-label,.sources-block h3,.pilot-spor .spor-label{font-weight:400!important}'
             if 'faelled' in html.stem:
              shape='@page{size:A4;margin:10mm} .hero h1{font-size:4.2rem!important;font-weight:400!important}.hero .subtitle{font-style:italic!important;font-weight:400!important}.pull-quote{font-weight:400!important}'
              profiles['local-fonts-old-weights-page10-title']= 'a.sw-access-skip{display:none!important}'+jost+shape
             else:
              profiles['local-fonts-jost-min400']='a.sw-access-skip{display:none!important}'+jost
              profiles['local-fonts-jost-min400-fallback-serif']='a.sw-access-skip{display:none!important}'+jost+'em,i{font-family:HistoricalSerif!important}'+css
            variants=[];selected=None
            for name,paper_css in profiles.items():
             print('BEGIN',pair['pdf'],name,flush=True);dest=folder/(name+'.pdf');fetcher=LocalFetcher();log.messages=[];font_config=FontConfiguration()
             HTML(filename=str(html),base_url='https://papers.spiralweb.earth/'+pair['html'],url_fetcher=fetcher).write_pdf(dest,stylesheets=[CSS(string=paper_css,font_config=font_config)],font_config=font_config)
             new=inspect(dest,name,folder);exact_text=baseline['page_texts']==new['page_texts'];exact_pixels=baseline['page_pixels']==new['page_pixels'] and baseline['page_sizes']==new['page_sizes']
             row=dict(profile=name,baseline_pages=baseline['pages'],rendered_pages=new['pages'],page_text_identical=exact_text,all_page_pixels_identical=exact_pixels,normalized_full_text_identical=norm('\n'.join(baseline['page_texts']))==norm('\n'.join(new['page_texts'])),outside_page_words=len(new['outside_page']),resources=fetcher.resources,warnings=list(log.messages),rendered_sha256=sha(dest.read_bytes()),repeatable=None)
             (folder/(name+'-details.json')).write_text(json.dumps(new,ensure_ascii=False,indent=2))
             (folder/(name+'-print.css')).write_text(paper_css)
             if exact_text and exact_pixels and not new['outside_page']:
              again=folder/(name+'-repeat.pdf');fc=FontConfiguration();HTML(filename=str(html),base_url='https://papers.spiralweb.earth/'+pair['html'],url_fetcher=fetcher).write_pdf(again,stylesheets=[CSS(string=paper_css,font_config=fc)],font_config=fc)
              with fitz.open(again) as d:
               row['repeatable']=[p.get_text() for p in d]==new['page_texts'] and [sha(p.get_pixmap(alpha=False).samples) for p in d]==new['page_pixels']
              assert row['repeatable'];selected=name
             variants.append(row);print('PROFILE_RESULT',pair['pdf'],json.dumps({k:v for k,v in row.items() if k not in ('resources','warnings')},ensure_ascii=False),flush=True)
             if selected:break
            case=dict(pair,selected_profile=selected,baseline_pages=baseline['pages'],baseline_fonts=baseline['fonts'],metadata=baseline['metadata'],classification='EXACT_REPEATABLE_BASELINE' if selected else 'PRINT_LINE_NOT_YET_REPRODUCED',variants=variants,visual_review='PENDING');report['cases'].append(case)
            (folder/'baseline-details.json').write_text(json.dumps(baseline,ensure_ascii=False,indent=2))
           assert len(report['cases'])==9
           report.update(result='DIAGNOSTIC_COMPLETE',exact_repeatable_pairs=sum(bool(c['selected_profile']) for c in report['cases']),unresolved_pairs=sum(not c['selected_profile'] for c in report['cases']))
          except Exception as e:
           report.update(result='STOP',error=repr(e));raise
          finally:
           report['repository_inputs_unchanged']=all((ROOT/n).is_file() and sha((ROOT/n).read_bytes())==h for n,h in inputs.items()) and set(inputs)=={str(p.relative_to(ROOT)) for p in ROOT.rglob('*') if p.is_file() and '.git' not in p.parts}
           (OUT/'RESULT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
           (OUT/'pip-freeze.txt').write_text(subprocess.check_output(['python','-m','pip','freeze'],text=True))
           (OUT/'fontconfig-inventory.txt').write_text(subprocess.check_output(['fc-list'],text=True))
           (OUT/'system-packages.txt').write_text(subprocess.check_output(['dpkg-query','-W'],text=True))
           m={str(p.relative_to(OUT)):sha(p.read_bytes()) for p in OUT.rglob('*') if p.is_file()};(OUT/'MANIFEST.json').write_text(json.dumps(m,indent=2))
           print('FINAL_BASELINE_RESULT',json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: papers-family4-nine-targeted-baselines
          path: ${{ runner.temp }}/pdf-baseline-proof
          retention-days: 30
          if-no-files-found: error

