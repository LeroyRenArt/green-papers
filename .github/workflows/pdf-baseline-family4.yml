name: Papers copy controls independent readiness
on:
  push:
    branches: [audit/pdf-baseline-family4-20261012]
    paths: [.github/workflows/pdf-baseline-family4.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3911f28c4e2a668abdd37c31fd42826f5c1bd1d7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install recorded browser control
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check current live clipboard and keyboard behaviour
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,json,hashlib,subprocess,traceback
          from playwright.sync_api import sync_playwright
          ROOT=Path.cwd();OUT=Path(os.environ['RUNNER_TEMP'])/'papers-copy-controls-readiness';OUT.mkdir()
          HEAD='3911f28c4e2a668abdd37c31fd42826f5c1bd1d7';MAIN='5aa261d1e733b81550b2a13cede1e3f6519ae56b';BASE='https://ee6b143e.green-papers.pages.dev';ROUTE='/toolbox/ai-in-right-relationship/'
          FILES=['toolbox/index.html','toolbox/ai-in-right-relationship/index.html','toolbox/ai-in-right-relationship/copy-starter.js']
          sha=lambda b:hashlib.sha256(b).hexdigest()
          result={'status':'RUNNING','source':HEAD,'timestamp_utc':datetime.now(timezone.utc).isoformat(),'checks':{},'cases':[],'keyboard':[],'production_publication_attempts':0,'repository_content_writes':0}
          def cmd(args,label):
           r=subprocess.run(args,capture_output=True,text=True,timeout=60);(OUT/(label+'.stdout')).write_text(r.stdout);(OUT/(label+'.stderr')).write_text(r.stderr);(OUT/(label+'.command.json')).write_text(json.dumps({'args':args,'exit_code':r.returncode}));assert r.returncode==0,label;return r.stdout.strip()
          def inspect(page):
           return page.evaluate('''()=>({overflow:document.documentElement.scrollWidth-innerWidth,duplicates:[...document.querySelectorAll('[id]')].map(e=>e.id).filter((id,i,a)=>a.indexOf(id)!==i)})''')
          try:
           assert cmd(['git','rev-parse','HEAD'],'head')==HEAD
           assert cmd(['git','ls-remote','origin','refs/heads/main'],'main-before').split()[0]==MAIN
           for i,f in enumerate(FILES):
            route='/toolbox/' if i==0 else ROUTE if i==1 else '/'+f
            bp=OUT/f'live-{i}.body';hp=OUT/f'live-{i}.headers'
            status=cmd(['curl','--silent','--show-error','--compressed','--max-time','30','--dump-header',str(hp),'--output',str(bp),'--write-out','%{http_code}',BASE+route],f'live-{i}')
            assert status=='200' and bp.read_bytes()==(ROOT/f).read_bytes(),f
           result['checks']['three_exact_preview_sources']=True
           assert cmd(['git','diff','--name-only',MAIN,HEAD],'exact-diff').splitlines()==['toolbox/ai-in-right-relationship/copy-starter.js','toolbox/ai-in-right-relationship/index.html']
           oldhtml=subprocess.check_output(['git','show',MAIN+':'+FILES[1]]).decode();newhtml=(ROOT/FILES[1]).read_text()
           assert newhtml.replace('<button type="button" hidden','<button type="button"').replace('copy-starter.js?v=20261012-1','copy-starter.js')==oldhtml
           oldjs=subprocess.check_output(['git','show',MAIN+':'+FILES[2]]).decode();assert (ROOT/FILES[2]).read_text().replace('    button.hidden = false;\n','')==oldjs
           public=json.loads((ROOT/'public-files.json').read_text());cmd(['node','scripts/build_public.mjs'],'public-build')
           assert sorted(str(p.relative_to(ROOT/'dist')) for p in (ROOT/'dist').rglob('*') if p.is_file())==sorted(public)
           for f in public:assert (ROOT/f).read_bytes()==(ROOT/'dist'/f).read_bytes()
           result['checks']['all_public_files_exact']=len(public);result['checks']['only_hidden_script_url_and_reveal_changes']=True
           for i,f in enumerate(FILES):
            route='/toolbox/' if i==0 else ROUTE if i==1 else '/'+f
            bp=OUT/f'production-{i}.body';hp=OUT/f'production-{i}.headers'
            status=cmd(['curl','--silent','--show-error','--compressed','--max-time','30','--dump-header',str(hp),'--output',str(bp),'--write-out','%{http_code}','https://papers.spiralweb.earth'+route],f'production-{i}')
            assert status=='200' and bp.read_bytes()==subprocess.check_output(['git','show',MAIN+':'+f]),f
           result['checks']['production_baseline_preserved']=True
           with sync_playwright() as pw:
            browser=pw.chromium.launch();result['browser_version']=browser.version
            for mode in ['native','browser_policy_denied','api_unavailable']:
             for width in [1440,390,360]:
              context=browser.new_context(viewport={'width':width,'height':1000},service_workers='block')
              if mode=='native':context.grant_permissions(['clipboard-read','clipboard-write'],origin=BASE)
              if mode=='browser_policy_denied':
               def denied(route):
                response=route.fetch();body=response.body();assert body==(ROOT/FILES[1]).read_bytes();headers=dict(response.headers);headers['permissions-policy']='clipboard-write=()';route.fulfill(response=response,headers=headers)
               context.route(BASE+ROUTE,denied)
              if mode=='api_unavailable':context.add_init_script("Object.defineProperty(navigator,'clipboard',{configurable:true,value:undefined})")
              page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto(BASE+ROUTE,wait_until='networkidle');assert response.status==200
              if mode=='browser_policy_denied':assert page.evaluate("document.featurePolicy.allowsFeature('clipboard-write')") is False
              if mode=='api_unavailable':assert page.evaluate('navigator.clipboard===undefined')
              assert page.locator('button[data-copy-target]').count()==7
              for i in range(7):
               button=page.locator('button[data-copy-target]').nth(i);target=button.get_attribute('data-copy-target');status=button.get_attribute('data-copy-status')
               if i>0:page.locator('#tools details').nth(i-1).locator('summary').click()
               expected=page.locator('#'+target).text_content().strip();button.click()
               wanted='Copied. Paste it into your conversation.' if mode=='native' else 'Select the prompt text above and copy it directly.'
               page.wait_for_function('arg=>document.getElementById(arg.id).textContent===arg.text',arg={'id':status,'text':wanted})
               if mode=='native':assert page.evaluate('navigator.clipboard.readText()')==expected
               else:
                # Prove the fallback text can actually be selected in this browser.
                selected=page.locator('#'+target).evaluate('''e=>{let r=document.createRange();r.selectNodeContents(e);let s=getSelection();s.removeAllRanges();s.addRange(r);return s.toString().trim()}''');assert selected==expected
               assert page.locator('#'+status).get_attribute('role')=='status' and page.locator('#'+status).get_attribute('aria-live')=='polite'
               observation=inspect(page);assert observation['overflow']==0 and not observation['duplicates'],observation
               result['cases'].append({'mode':mode,'width':width,'target':target,'label':button.get_attribute('aria-label') or button.inner_text(),'expected_sha256':sha(expected.encode()),'status':wanted,'native_clipboard_readback':mode=='native','fallback_selectable':mode!='native',**observation})
              assert not errors,errors
              page.locator('#tools').screenshot(path=str(OUT/f'tools-{mode}-{width}.png'))
              context.close()
            for width in [1440,390,360]:
             context=browser.new_context(viewport={'width':width,'height':1000},permissions=['clipboard-read','clipboard-write']);page=context.new_page();page.goto(BASE+ROUTE,wait_until='networkidle')
             page.keyboard.press('Tab');assert page.evaluate('document.activeElement.className')=='sw-access-skip';page.keyboard.press('Enter');assert page.evaluate('document.activeElement.id')=='main-content'
             tab_path=[]
             for k in range(70):
              page.keyboard.press('Tab');info=page.evaluate('''()=>{let e=document.activeElement;let s=getComputedStyle(e);return {tag:e.tagName,id:e.id,text:e.textContent.trim().slice(0,100),target:e.dataset.copyTarget||'',outline:s.outlineStyle,outlineWidth:s.outlineWidth}}''');tab_path.append(info)
              if info['tag']=='SUMMARY' and info['text']=='Try this prompt':
               assert info['outline']!='none' and info['outlineWidth']!='0px';page.keyboard.press('Enter');page.keyboard.press('Tab');target=page.evaluate('document.activeElement.dataset.copyTarget');assert target.startswith('tool-prompt-')
               for key in ['Enter','Space']:
                page.evaluate("navigator.clipboard.writeText('FAMILY5_KEYBOARD_SENTINEL')");page.keyboard.press(key);page.wait_for_function("document.activeElement.parentElement.querySelector('[role=status]').textContent.startsWith('Copied.')")
                assert page.evaluate('navigator.clipboard.readText()')==page.locator('#'+target).text_content().strip()
              if info['id']=='copy-starter':
               assert info['outline']!='none' and info['outlineWidth']!='0px'
               for key in ['Enter','Space']:
                page.evaluate("navigator.clipboard.writeText('FAMILY5_KEYBOARD_SENTINEL')");page.keyboard.press(key);page.wait_for_function("document.querySelector('#copy-status').textContent.startsWith('Copied.')");assert page.evaluate('navigator.clipboard.readText()')==page.locator('#pocket-prompt').text_content().strip()
              if info['tag']=='A' and info['text']=='Papers privacy':break
             assert sum(x['tag']=='SUMMARY' and x['text']=='Try this prompt' for x in tab_path)==6
             assert any(x['id']=='copy-starter' for x in tab_path)
             result['keyboard'].append({'width':width,'skip_link':True,'six_disclosures':True,'enter_and_space_native_readback':True,'tab_path':tab_path})
             context.close()
            result['readiness_modes']=[]
            for mode in ['no_javascript','script_blocked','script_delayed']:
             for width in [1440,390,360]:
              context=browser.new_context(java_script_enabled=mode!='no_javascript',viewport={'width':width,'height':1000},permissions=['clipboard-read','clipboard-write']);held=[]
              if mode=='script_blocked':context.route('**/copy-starter.js*',lambda route:route.abort())
              if mode=='script_delayed':context.route('**/copy-starter.js*',lambda route:held.append(route))
              page=context.new_page();page.goto(BASE+ROUTE,wait_until='commit' if mode=='script_delayed' else 'networkidle');page.locator('#pocket-prompt').wait_for(state='visible')
              assert page.locator('a[download]').count()==2
              for i in range(6):page.locator('#tools summary').nth(i).click();assert page.locator('#tool-prompt-'+str(i+1)).is_visible()
              assert page.evaluate("[...document.querySelectorAll('button[data-copy-target]')].every(b=>b.hidden)")
              assert page.locator('button[data-copy-target]:visible').count()==0
              observation=inspect(page);assert observation['overflow']==0
              if mode!='script_delayed':page.locator('.starter').screenshot(path=str(OUT/f'starter-{mode}-{width}.png'))
              case={'mode':mode,'width':width,'zero_visible_inactive_copy_controls':True,'prompts_and_download_links_available':True,**observation}
              if mode=='script_delayed':
               assert len(held)==1;held[0].continue_();page.wait_for_function("[...document.querySelectorAll('button[data-copy-target]')].every(b=>!b.hidden)")
               page.locator('#copy-starter').click();page.wait_for_function("document.querySelector('#copy-status').textContent.startsWith('Copied.')")
               assert page.evaluate('navigator.clipboard.readText()')==page.locator('#pocket-prompt').text_content().strip();case['reveals_only_after_script_ready_and_copies']=True;page.locator('.starter').screenshot(path=str(OUT/f'starter-{mode}-{width}.png'))
              result['readiness_modes'].append(case);context.close()
            browser.close()
           assert len(result['cases'])==63 and len(result['keyboard'])==3
           assert cmd(['git','ls-remote','origin','refs/heads/main'],'main-after').split()[0]==MAIN
           result['status']='PASS_COPY_CONTROLS_READINESS';result['run_id']=os.environ['GITHUB_RUN_ID'];result['control_commit']=os.environ['GITHUB_SHA']
          except Exception as e:
           result['status']='STOP';result['error']=str(e);(OUT/'traceback.txt').write_text(traceback.format_exc());raise
          finally:
           (OUT/'RESULT.json').write_text(json.dumps(result,indent=2));(OUT/'MANIFEST.json').write_text(json.dumps({str(p.relative_to(OUT)):sha(p.read_bytes()) for p in OUT.iterdir() if p.is_file()},indent=2))
          PYCODE
      - name: Preserve PASS or STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: papers-copy-controls-readiness
          path: ${{ runner.temp }}/papers-copy-controls-readiness
          retention-days: 30
          if-no-files-found: error
